# Markdown linting configuration

# Increase line length limit to 150 characters (more reasonable for modern editors)
MD013:
  line_length: 150

# Require proper table formatting (spaces around pipes)
MD060:
  strict: true

# Require language specification for code blocks
MD040: true

# Allow inline HTML (useful for formatting)
MD033: false

# Don't require blank lines around lists
MD032: false

MD060: false

MD004: 
  style: "dash"
MD007:
  indent: 2
