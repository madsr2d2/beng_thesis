[requirements.008]
# Classification Metadata
  category = "ERR"
  side = "TX"
  format = ["CB", "CE", "FB", "FE"]
  priority = "critical"
# Core Specification
  description = "TX shall suppress the bit error reaction in exactly three contexts where monitored ≠ transmitted is expected or permitted: (a) recessive transmitted on a non-stuff bit in the arbitration field, dominant monitored — arbitration loss, not an error; (b) recessive transmitted in the ACK slot, dominant monitored — normal acknowledgment, not an error; (c) error-passive node transmitting passive error flag (recessive), dominant monitored — overwritten by another node's active error flag, not an error."
  iso_reference = "6.6.21.2"
  acceptance_criteria = "No bit error flagged for: (a) transmitter sends recessive, monitors dominant on a non-stuff bit during arbitration (normal arbitration loss); (b) dominant monitored during recessive ACK slot (normal acknowledgment); (c) dominant monitored during passive error flag (other node's active error flag expected)"
  notes = "These three contexts are the complete exception set. Any monitored ≠ transmitted outside these contexts triggers the error reaction in REQ-007. The old exception (d) for FD frames has been absorbed into REQ-007 (SSP/TDC path)."
  target_module = ""
# PRE/EVT/POST Analysis
  pre  = "SP strobe fires and monitored_bit ≠ transmitted_bit"
  evt  = "Exception context matched: (a) non-stuff arbitration bit and transmitted=recessive, OR (b) ACK slot and transmitted=recessive, OR (c) passive error flag and transmitted=recessive"
  post = "Error condition NOT asserted; no error flag; no TEC increment"
# Verification Strategy & Status
  verification = "simulation"
  status = "unverified"

