[requirements.007]
# Classification Metadata
  category = "ERR"
  side = "TX"
  format = ["CB", "CE", "FB", "FE"]
  priority = "critical"
# Core Specification
  description = "TX detects a bit error whenever the monitored bus bit differs from the transmitted bit at SP. This single mechanism covers all field contexts: data bits, dynamically-stuffed bits, fixed-form bits, and fixed stuff bits. During the FD data phase with TDC active, the SP comparison is suppressed and the SSP comparison is used instead; the error reaction is deferred to the following SP."
  iso_reference = "6.6.21.2, 6.6.21.3.1, 7.3.4"
  acceptance_criteria = "Without TDC: bit error detected at SP when monitored differs from transmitted; With TDC in FD data phase: SP comparison ignored, SSP comparison used, error reaction deferred to following SP"
  notes = "Sole TX error detection mechanism. What ISO calls stuff errors and form errors are detected by the TX via this same bit-compare path — the TX generated those bits correctly, so any corruption appears as monitored ≠ transmitted. Stuff error and form error classification is an RX-side concern."
  target_module = ""
# PRE/EVT/POST Analysis
  pre  = "Transmitter is actively driving bits onto the bus (outside the three exception contexts of REQ-008); TDC mode off OR bit is outside FD data phase"
  evt  = "SP strobe fires and monitored_bit ≠ transmitted_bit"
  post = "Error condition asserted; error flag sequence begins at next bit boundary"
# Verification Strategy & Status
  verification = "simulation"
  status = "unverified"

