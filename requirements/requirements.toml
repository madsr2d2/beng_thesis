scope = "node"
side = "both"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
precondition = "The node is at the third bit of intermission"
event = "A dominant bit is sampled at the third bit of intermission"
postcondition = "The node interprets this dominant bit as a Start of Frame (SOF)"
