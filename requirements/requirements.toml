# ============================================================
# CAN Requirements Specification
# ISO reference: ISO 11898-1:2015
# ============================================================
#
# --- Requirement Keys ---
#
# [requirements.NNN]                  Unique numeric ID (001-117)
#
# -- Classification Metadata --
#   category        : string          Functional area
#                     "CRC"           CRC polynomial selection and generation
#                     "ERR"           Error detection & handling (bit, stuff, form, CRC errors)
#                     "FRM"           Frame structure, fields, arbitration, control, stuffing, completion
#                     "TMG"           Bit timing, sample points, TDC compensation
#
#   side            : string          Which path the requirement applies to
#                     "TX"            Transmitter
#                     "RX"            Receiver
#
#   format          : list[string]    Applicable CAN frame formats (one or more)
#                     "CB"            Classic Basic (CBFF, 11-bit ID)
#                     "CE"            Classic Extended (CEFF, 29-bit ID)
#                     "FB"            FD Basic (FBFF, 11-bit ID)
#                     "FE"            FD Extended (FEFF, 29-bit ID)
#
#   priority        : string          Implementation priority (descending)
#                     "critical"      Must-have for correct protocol operation
#                     "high"          Important but not blocking
#                     "medium"        Desired for completeness
#                     "low"           Nice-to-have / future work
#
# -- Core Specification --
#   description           : string    What the requirement specifies
#   iso_reference         : string    ISO 11898-1:2015 clause(s), e.g. "6.6.10.2"
#   acceptance_criteria   : string    Pass/fail condition for verification
#   notes                 : string    Clarifications, context, known issues
#   target_module         : string    VHDL module that implements this (empty if unassigned)
#
# -- Verification Strategy & Status --
#   verification          : string    Primary verification method
#                           "simulation"      Testbench assertion
#                           "coverage"        Functional coverage point
#                           "waveform"        Manual waveform inspection (GTKWave)
#                           "assertion"       Formal/inline assertion
#
#   status                : string    Current verification status
#                           "verified"       Fully verified and passing
#                           "implemented"    Code exists but not yet verified
#                           "unverified"     Not yet implemented or tested
#                           "diagnostic"     Under investigation / partial results
#                           "not applicable" Out of project scope
#
# -- Verification Tracking Sub-tables --
#   [requirements.NNN.simulation]
#     test_case   : string            Test procedure name
#     file        : string            Testbench file path
#     passed      : bool              true if test passes
#     coverage    : string            Coverage metric or bin name
#
#   [requirements.NNN.formal]
#     property_label  : string        PSL property name
#     file            : string        Formal property file path
#     depth_reached   : integer       BMC depth achieved (0 = not run)
#
# ============================================================

