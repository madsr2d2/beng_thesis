file = ""

[[requirement]]
id = "REQ-MAC-064"
source_clause = "ISO 11898-1:2024 §6.6.13.2"
original_wording = "Whenever a transmitter detects five consecutive bits (including dynamic stuff bits) of the identical value in the bit stream to be transmitted, it shall insert a complementary bit (called dynamic stuff bit) into the actual transmitted bit stream."
shape = "triggered"
scope = "node"
side = "transmitter"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
precondition = "The transmitter is in a frame region subject to dynamic bit stuffing"
event = "Five consecutive bits of identical value are detected in the bit stream"
postcondition = "A complementary (opposite value) dynamic stuff bit is inserted into the transmitted bit stream"
