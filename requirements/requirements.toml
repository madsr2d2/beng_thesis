# CAN System Requirements
# ID format: {CATEGORY}{NNN}{SIDE}
#
# Categories: FRM=Frame/Arb/Control/Stuffing/Completion
#             TMG=Bit Timing & TDC
#             ERR=Error Detection & Handling
#             CRC=CRC Generation
#
# Side:       TX=Transmitter  RX=Receiver
#
# Format:     CB=Classic Basic  CE=Classic Extended
#             FB=FD Basic       FE=FD Extended

# ============================================================
# FRAME FORMAT, ARBITRATION, CONTROL & COMPLETION
# ============================================================

