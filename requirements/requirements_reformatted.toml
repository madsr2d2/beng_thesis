postcondition = "The MAC transmitter implements all listed data encapsulation and medium access management functions"
flags = ["DOC_ONLY", "COMPOUND"]
notes = "DOC_ONLY: enumeration of TX capabilities — each is specified in detail in later subsections. COMPOUND: numerous distinct sub-claims. XL-specific items (XLF bit, resXL, etc.) excluded as out of scope. All four formats require these TX functions."
label = ""
file = ""

