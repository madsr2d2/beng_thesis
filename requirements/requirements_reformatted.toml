# ── §6.4.5.5.2 L_Data.Request ──

[[requirement]]
id = "REQ-LLC-009"
source_clause = "ISO 11898-1:2024 §6.4.5.5.2"
original_wording = "The L_Data.Request service shall be passed from the LLC user to the LLC sub-layer to request that an LLC frame is sent to one or more remote LLC entities. ; The service shall provide parameters as follows: L_Data.Request(Frame, Handle)."
shape = "invariant"
scope = "node"
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
precondition = "The LLC user wishes to transmit an LLC frame"
postcondition = "The L_Data.Request service is available from user to LLC with parameters Frame and Handle"
flags = ["DOC_ONLY"]
notes = "Service interface direction and parameter definition. DOC_ONLY because service primitive direction is implicit in the protocol handshake architecture. All four formats use the same L_Data.Request primitive."
label = ""
file = ""

[[requirement]]
id = "REQ-LLC-010"
source_clause = "ISO 11898-1:2024 §6.4.5.5.2"
original_wording = "Receipt of this service shall cause the LLC sub-layer to initiate the transfer of an LLC frame by use of the data transfer service provided by the MAC sub-layer (see 6.6)."
shape = "triggered"
scope = "node"
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
precondition = "LLC sub-layer is operational"
event = "L_Data.Request is received from the LLC user"
postcondition = "LLC sub-layer initiates MAC frame transfer via the MAC data transfer service"
flags = ["EXTERNAL_DEP"]
notes = "EXTERNAL_DEP: postcondition involves invoking the MAC sub-layer service (§6.6). The initiation of transfer is assertable as a handshake to the MAC layer. All four formats use the same initiation path."
label = ""
file = ""

[[requirement]]
id = "REQ-LLC-011"
source_clause = "ISO 11898-1:2024 §6.4.5.5.2"
original_wording = "Any L_Data.Request shall be processed not later than the second SOF after the request when there are no EFs present during this time."
shape = "liveness"
scope = "node"
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
precondition = "An L_Data.Request has been received by the LLC sub-layer and no error frames occur between request and processing"
postcondition = "The request is processed (transfer initiated or queued) before the second SOF following the request"
flags = []
notes = "Liveness with a practical bound: 'not later than the second SOF'. This is not a fixed cycle count — the SOF timing depends on bus activity. Testbench can impose a timeout based on worst-case inter-frame spacing. All four formats share the same timing obligation."
label = ""
file = ""

# ── §6.4.5.5.3 L_Data.AbortRequest ──

[[requirement]]
id = "REQ-LLC-012"
source_clause = "ISO 11898-1:2024 §6.4.5.5.3"
original_wording = "The L_Data.AbortRequest service shall be passed from the LLC user to the LLC sub-layer to abort a previous request of an LLC frame transmission. ; The service request shall provide the following parameters: L_Data.AbortRequest(Handle)."
shape = "invariant"
scope = "node"
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
precondition = "The LLC user wishes to abort a previously requested transmission"
postcondition = "The L_Data.AbortRequest service is available from user to LLC with parameter Handle"
flags = ["DOC_ONLY"]
notes = "Service interface direction and parameter definition. DOC_ONLY because this defines the interface primitive, not a runtime behavior. All four formats use the same abort mechanism."
label = ""
file = ""

[[requirement]]
id = "REQ-LLC-013"
source_clause = "ISO 11898-1:2024 §6.4.5.5.3"
original_wording = "Receipt of this service shall cause the LLC sub-layer to abort the transfer of an LLC frame in the specified LLC storage unit."
shape = "triggered"
scope = "node"
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
precondition = "A pending or active LLC frame transmission exists for the specified Handle"
event = "L_Data.AbortRequest is received from the LLC user"
postcondition = "LLC sub-layer marks the specified transmission for abortion"
flags = []
notes = "The actual abortion may be deferred per REQ-LLC-014; this requirement covers the immediate effect of receiving the abort primitive. All four formats use the same abort mechanism."
label = ""
file = ""

[[requirement]]
id = "REQ-LLC-014"
source_clause = "ISO 11898-1:2024 §6.4.5.5.3"
original_wording = "Pending transmissions, which are already passed to the MAC sub-layer, shall only be aborted if: an error in the MAC sub-layer during transmission occurs, or arbitration was lost in the MAC sub-layer, which causes the LLC frame to wait for another transmission attempt. ; This means that an abortion request shall be kept pending in the LLC layer until either one of the above situations occur, or until the transmission was completed."
shape = "invariant"
scope = "node"
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
precondition = "An L_Data.AbortRequest has been received for a transmission already submitted to the MAC sub-layer"
postcondition = "The abort is deferred until either (a) a MAC error occurs, (b) arbitration is lost, or (c) the transmission completes; the abort request remains pending in the LLC layer until one of these conditions is met"
flags = ["EXTERNAL_DEP", "COMPOUND"]
notes = "COMPOUND: (1) abort only on MAC error or arbitration loss; (2) abort request kept pending until condition met. EXTERNAL_DEP: depends on MAC sub-layer error/arbitration status. All four formats share the same abort deferral logic."
label = ""
file = ""

[[requirement]]
id = "REQ-LLC-015"
source_clause = "ISO 11898-1:2024 §6.4.5.5.3"
original_wording = "Any L_Data.AbortRequest shall be processed prior to the second SOF after the request when there are no EFs present during this time. ; Any L_Data.AbortRequest shall be processed prior to the third SOF after the request when there are EFs present during this time."
shape = "liveness"
scope = "node"
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
precondition = "An L_Data.AbortRequest has been received by the LLC sub-layer"
postcondition = "The abort request is processed prior to the second SOF (no EFs) or the third SOF (with EFs) after the request"
flags = ["COMPOUND"]
notes = "COMPOUND: two distinct timing bounds depending on whether error frames are present. Liveness with SOF-based practical bounds. Testbench imposes timeout based on worst-case inter-frame spacing. All four formats share the same timing obligation."
label = ""
file = ""

# ── §6.4.5.5.4 L_Data.Confirm ──

[[requirement]]
id = "REQ-LLC-016"
source_clause = "ISO 11898-1:2024 §6.4.5.5.4"
original_wording = "The L_Data.Confirm service shall be passed from the local LLC sub-layer to the LLC user to convey the results of the previous L_Data.Request service. ; This service shall be a local confirmation, i.e. it shall not imply that the remote LLC entity or entities are passing the associated indication service to the corresponding LLC user(s). ; The service shall provide parameters as follows: L_Data.Confirm(Transfer_Status, Timestamp, Handle)."
shape = "invariant"
scope = "node"
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
precondition = "A previous L_Data.Request has been issued"
postcondition = "The L_Data.Confirm service is available from LLC to user with parameters Transfer_Status, Timestamp, Handle; the confirmation is local and does not imply remote delivery"
flags = ["DOC_ONLY", "COMPOUND"]
notes = "COMPOUND: (1) service direction and parameters; (2) local-only semantics; (3) no remote delivery implication. DOC_ONLY because service primitive definition is not independently RTL-assertable. All four formats use the same confirm primitive."
label = ""
file = ""

[[requirement]]
id = "REQ-LLC-017"
source_clause = "ISO 11898-1:2024 §6.4.5.5.4"
original_wording = "The Transfer_Status shall be used to indicate the status of the transaction initiated by the previous L_Data.Request service. ; Transfer_Status: [Ongoing, Lost Arbitration, Transmitted, Aborted, Disturbed]."
shape = "invariant"
scope = "node"
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
precondition = "An L_Data.Confirm is being generated"
postcondition = "The Transfer_Status field accurately reflects the current transaction status using one of: Ongoing, Lost Arbitration, Transmitted, Aborted, Disturbed"
flags = []
notes = "The five Transfer_Status values are enumerated. This is assertable: after each frame transaction, the reported status must match the actual outcome. All four formats use the same status set."
label = ""
file = ""

# ── §6.4.5.5.5 L_Data.Indication ──

[[requirement]]
id = "REQ-LLC-018"
source_clause = "ISO 11898-1:2024 §6.4.5.5.5"
original_wording = "The L_Data.Indication service shall be passed from the LLC sub-layer to the LLC user to indicate the arrival of the data of an LLC frame after the reception of a MAC frame. ; The service shall provide parameters as follows: L_Data.Indication(Frame, Timestamp)."
shape = "invariant"
scope = "node"
side = "receiver"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
precondition = "A MAC frame has been successfully received"
postcondition = "The L_Data.Indication service is issued to the LLC user with parameters Frame and Timestamp"
flags = ["DOC_ONLY"]
notes = "Service interface direction and parameter definition for reception. DOC_ONLY because the service primitive direction is implicit in the protocol architecture. All four formats use the same indication primitive."
