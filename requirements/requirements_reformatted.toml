[[requirement]]
id = "REQ-MAC-052"
source_clause = "ISO 11898-1:2024 §6.6.10.6"
original_wording = "All nodes that receive the matching FCRC sequence shall send an ACK within the ACK slot by overwriting the recessive bit of the transmitter with a dominant bit (they send ACK)."
shape = "triggered"
scope = "bus"
side = "receiver"
layer = "MAC"
format_applicability = "CB, CE"
precondition = "A CC frame has been received and the calculated FCRC matches the received FCRC"
event = "The ACK slot position is reached"
postcondition = "The receiver sends a dominant bit in the ACK slot, overwriting the transmitter's recessive bit"
flags = []
notes = "Bus-scope because the receiver's dominant bit overwrites the transmitter's recessive bit on the shared bus. Only CB and CE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-053"
source_clause = "ISO 11898-1:2024 §6.6.10.6"
original_wording = "The ACK delimiter, being the last bit of the ACK field, shall be a recessive bit."
shape = "invariant"
scope = "frame"
side = "both"
layer = "MAC"
format_applicability = "CB, CE"
precondition = "The ACK delimiter position of a CC frame is reached"
postcondition = "The ACK delimiter is a single recessive bit"
flags = []
notes = "The ACK slot is surrounded by recessive bits (CRC delimiter and ACK delimiter). Only CB and CE apply."
label = ""
file = ""

# ── §6.6.10.7 EOF (CC) ──

[[requirement]]
id = "REQ-MAC-054"
source_clause = "ISO 11898-1:2024 §6.6.10.7"
original_wording = "DFs and RFs shall be delimited by a flag sequence consisting of seven recessive bits forming the EOF."
shape = "invariant"
scope = "frame"
side = "both"
layer = "MAC"
format_applicability = "CB, CE"
precondition = "A CC DF or RF is being terminated"
postcondition = "The EOF field is exactly seven consecutive recessive bits"
flags = []
notes = "CC EOF structure. Only CB and CE apply; FD EOF is specified in §6.6.11.7."
label = ""
file = ""

# ── §6.6.11.2 Arbitration field (FD) ──

[[requirement]]
id = "REQ-MAC-055"
source_clause = "ISO 11898-1:2024 §6.6.11.2"
original_wording = "The values of the identifier bits shall be passed from the ID field of the LLC frame. The values of the SRR, IDE and RRS bits shall be defined by the format field of the LLC frame."
shape = "invariant"
scope = "node"
side = "transmitter"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "An FD frame arbitration field is being constructed for transmission"
postcondition = "Identifier bits come from LLC ID field; SRR, IDE, and RRS bits from LLC format field"
flags = []
notes = "Defines LLC-to-MAC mapping for FD arbitration field bits. Only FB and FE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-056"
source_clause = "ISO 11898-1:2024 §6.6.11.2"
original_wording = "Arbitration between FD frames shall start with the ID28 bit and shall end with the FDF bit in the control field. When a node transmits a recessive bus state at one of these bits and samples a dominant bus state, it shall lose arbitration and it shall become receiver of that frame."
shape = "triggered"
scope = "node"
side = "transmitter"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "An FD frame is in the arbitration phase (ID28 through FDF bit)"
event = "The node transmits a recessive bit and samples a dominant bit during FD arbitration"
postcondition = "The node loses arbitration and becomes receiver of the frame"
flags = []
notes = "FD arbitration range: ID28 to FDF bit. Only FB and FE apply. Substantively similar to REQ-MAC-041 (CC arbitration) but with different range endpoint (FDF instead of RTR)."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-057"
source_clause = "ISO 11898-1:2024 §6.6.11.2"
original_wording = "The SRR bit shall be transmitted recessive, but receivers shall accept recessive and dominant SRR bits."
shape = "invariant"
scope = "node"
side = "both"
layer = "MAC"
format_applicability = "FE"
precondition = "A FEFF frame is being transmitted or received"
postcondition = "The transmitter sends SRR as recessive; receivers accept both recessive and dominant SRR"
flags = ["COMPOUND"]
notes = "COMPOUND: (1) TX sends recessive; (2) RX accepts both. Substantively duplicates REQ-MAC-042 from §6.6.10.2 — wording is identical but applies to FEFF. Only FE (FEFF) has the SRR bit among FD formats."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-058"
source_clause = "ISO 11898-1:2024 §6.6.11.2"
original_wording = "The RRS bit shall be transmitted dominant, but receivers shall accept recessive and dominant RRS bits."
shape = "invariant"
scope = "node"
side = "both"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "An FD frame is being transmitted or received"
postcondition = "The transmitter sends RRS as dominant; receivers accept both recessive and dominant RRS"
flags = ["COMPOUND"]
notes = "COMPOUND: (1) TX sends dominant; (2) RX accepts both. The NOTE clarifies recessive RRS is not a form error. Only FB and FE apply."
label = ""
file = ""

# ── §6.6.11.3 Control field (FD) ──

[[requirement]]
id = "REQ-MAC-059"
source_clause = "ISO 11898-1:2024 §6.6.11.3"
original_wording = "In FD frames, the FDF bit shall be followed by the dominant res bit. ; When an FD enabled receiver detects the res bit to be recessive instead of the expected dominant it shall, when protocol exception handling is enabled, detect a protocol exception event; when protocol exception handling is disabled, it shall treat this as a form error."
shape = "invariant"
scope = "node"
side = "both"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "An FD frame control field is being processed"
postcondition = "The res bit following FDF is dominant; if recessive: protocol exception event (when exception handling enabled) or form error (when disabled)"
flags = ["COMPOUND"]
notes = "COMPOUND: (1) res bit is dominant; (2) recessive res → protocol exception or form error depending on configuration. Only FB and FE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-060"
source_clause = "ISO 11898-1:2024 §6.6.11.3"
original_wording = "If the bit is detected recessive, the bit rate shall be switched from the nominal bit rate of the arbitration phase to the preconfigured FD data bit rate of the data phase."
shape = "triggered"
scope = "node"
side = "both"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "An FD frame is being processed and the BRS bit position is reached"
event = "The BRS bit is detected (sampled) as recessive"
postcondition = "The bit rate switches from the nominal arbitration bit rate to the preconfigured FD data bit rate"
flags = []
notes = "BRS=recessive triggers the bit rate switch. BRS=dominant means no switch. Only FB and FE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-061"
source_clause = "ISO 11898-1:2024 §6.6.11.3"
original_wording = "When the ESI bit of the LLC frame is set, then this flag shall be transmitted recessive, else this flag shall be transmitted dominant by error active nodes and shall be transmitted recessive by error passive nodes."
shape = "invariant"
scope = "node"
side = "transmitter"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "An FD frame ESI bit is being transmitted"
postcondition = "If LLC ESI=1: ESI transmitted recessive. If LLC ESI=0: ESI transmitted dominant by error-active nodes and recessive by error-passive nodes"
flags = ["COMPOUND", "EXTERNAL_DEP"]
notes = "COMPOUND: three sub-claims depending on LLC ESI value and FCE error state. EXTERNAL_DEP: Error Active/Passive state is owned by FCE (§8). Only FB and FE apply."
label = ""
file = ""

# ── §6.6.11.4 Data field (FD) ──

[[requirement]]
id = "REQ-MAC-062"
source_clause = "ISO 11898-1:2024 §6.6.11.4"
original_wording = "The data field shall consist of the data passed from the LLC frame, the number of bytes given by frame format and DLC. The data bytes are transmitted sequentially starting with byte 0, each byte shall contain eight bit."
shape = "invariant"
scope = "frame"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "An FD data frame has DLC > 0"
postcondition = "The data field contains the data from the LLC frame, byte count determined by format and DLC per Table 5, transmitted sequentially from byte 0, each byte 8 bits"
flags = []
notes = "Substantively similar to REQ-MAC-046 (CC data field) but the DLC-to-byte mapping differs for FD frames (DLC 9–15 map to 12–64 bytes per Table 5). Only FB and FE apply."
label = ""
file = ""

# ── §6.6.11.5 CRC field (FD) ──

[[requirement]]
id = "REQ-MAC-063"
source_clause = "ISO 11898-1:2024 §6.6.11.5"
original_wording = "The CRC field shall contain the stuff count and the FCRC sequence followed by a recessive CRC delimiter."
shape = "invariant"
scope = "frame"
side = "both"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "The CRC field of an FD frame is being transmitted or received"
postcondition = "The CRC field consists of: stuff count (SBC), then FCRC sequence, then recessive CRC delimiter"
flags = []
notes = "FD CRC field structure differs from CC by including the stuff count (SBC) before the FCRC. Only FB and FE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-064"
source_clause = "ISO 11898-1:2024 §6.6.11.5"
original_wording = "In FD frames, the stuff count shall be at the beginning of the CRC field. It shall represent a number in the range from 0 to 7d (Gray-coded in SBC3, SBC2, and SBC1; followed by the parity bit SBC0) as specified in Table 8."
shape = "invariant"
scope = "frame"
side ="both"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "The CRC field of an FD frame is being constructed or parsed"
postcondition = "The stuff count (4 bits: SBC3, SBC2, SBC1 Gray-coded + SBC0 parity) is at the beginning of the CRC field, encoding the number of dynamic stuff bits modulo 8"
flags = []
notes = "The Gray coding and parity are specified in Table 8. Only FB and FE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-065"
source_clause = "ISO 11898-1:2024 §6.6.11.5"
original_wording = "Both transmitter and receivers of a frame shall count the number of stuff bits before the first fixed stuff bit in the frame. The transmitter shall transmit its stuff bit count, coded as stuff count, at the beginning of the CRC field, before the FCRC sequence. Receivers shall check whether the received stuff count matches with the value calculated from their own stuff bit count."
shape = "invariant"
scope = "node"
side = "both"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "An FD frame is being transmitted or received"
postcondition = "TX and RX count dynamic stuff bits before the first fixed stuff bit; TX transmits the count as stuff count (SBC); RX verifies the received SBC matches its own count"
flags = ["COMPOUND"]
notes = "COMPOUND: (1) both TX/RX count stuff bits; (2) TX transmits SBC; (3) RX checks SBC match. Only FB and FE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-066"
source_clause = "ISO 11898-1:2024 §6.6.11.5"
original_wording = "The relevant bit stream for the CRC calculation shall be the bit stream consisting of SOF, arbitration field, control field, and (if present) data field. The stuff count and the dynamic stuff bits, but not the fixed stuff bits, shall be included in the relevant bit stream for CRC calculation of FD frames."
shape = "invariant"
scope = "frame"
side = "both"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "CRC (CRC_17 or CRC_21) is being calculated for an FD frame"
postcondition = "The CRC input bit stream is: SOF + arbitration + control + data (if present); stuff count and dynamic stuff bits are included; fixed stuff bits are excluded"
flags = []
notes = "Key difference from CC CRC (REQ-MAC-048): FD CRC includes dynamic stuff bits and stuff count. Only FB and FE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-067"
source_clause = "ISO 11898-1:2024 §6.6.11.5"
original_wording = "The CRC delimiter shall follow the FCRC sequence. In FD frames, the CRC delimiter may consist of one or two recessive bits. A transmitter shall send one recessive bit as CRC delimiter, but it shall accept two recessive bits before the edge from recessive to dominant that starts the acknowledge slot."
shape = "invariant"
scope = "node"
side = "transmitter"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "The CRC delimiter position of an FD frame is reached"
postcondition = "TX sends one recessive CRC delimiter bit; TX accepts up to two recessive bits before the dominant edge starting the ACK slot"
flags = ["COMPOUND"]
notes = "COMPOUND: (1) TX sends 1 recessive; (2) accepts 2 recessive before ACK edge. This allows phase compensation between TX and RX bit timing. Only FB and FE apply."
label = ""
file = ""

# ── §6.6.11.6 ACK field (FD) ──

[[requirement]]
id = "REQ-MAC-068"
source_clause = "ISO 11898-1:2024 §6.6.11.6"
original_wording = "The ACK field shall contain the ACK slot and the ACK delimiter. ; In the ACK field, the transmitter node shall send recessive bits. All receivers check the consistency of the received DF and shall acknowledge a consistent frame and shall flag an inconsistent frame by means of an EF. A DF that is not acknowledged shall be regarded as corrupted and shall be flagged by the transmitting node with an EF."
shape = "invariant"
scope = "node"
side = "both"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "An FD frame ACK field is being processed"
postcondition = "ACK field = ACK slot + delimiter; TX sends recessive; RX acknowledges consistent frames and flags inconsistent ones with EF; unacknowledged DF is corrupted and TX sends EF"
flags = ["COMPOUND"]
notes = "COMPOUND: multiple sub-claims. Substantively similar to REQ-MAC-050/051 for CC but applies only to DFs (no FD remote frames). Only FB and FE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-069"
source_clause = "ISO 11898-1:2024 §6.6.11.6"
original_wording = "Nodes that receive the matching FCRC sequence and the matching stuff count shall send an ACK within the ACK slot by overwriting the recessive bit of the transmitter with a dominant bit (they send ACK). ; In FD frames, all nodes shall accept an up to two bit long dominant phase of overlapping ACK slot bits as a valid ACK, to compensate for phase shifts between the receivers."
shape = "triggered"
scope = "bus"
side = "both"
side = "receiver"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "An FD frame has been received with matching FCRC and matching stuff count"
event = "The ACK slot position is reached"
postcondition = "The receiver sends dominant in the ACK slot; all nodes accept up to a 2-bit-long dominant phase as valid ACK"
flags = ["COMPOUND"]
notes = "COMPOUND: (1) receivers with matching FCRC+SBC send dominant ACK; (2) all nodes accept up to 2-bit dominant as valid ACK. The 2-bit tolerance compensates for phase shifts. Bus-scope because the receiver's dominant overwrites the TX's recessive. Only FB and FE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-070"
source_clause = "ISO 11898-1:2024 §6.6.11.6"
original_wording = "The ACK delimiter, being the last bit of the ACK field, shall be a recessive bit."
shape = "invariant"
scope = "frame"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "The ACK delimiter position of an FD frame is reached"
postcondition = "The ACK delimiter is a single recessive bit"
flags = []
notes = "Substantively duplicates REQ-MAC-053 from §6.6.10.6 — same structural rule but for FD frames. Only FB and FE apply."
label = ""
file = ""

# ── §6.6.11.7 EOF (FD) ──

[[requirement]]
id = "REQ-MAC-071"
source_clause = "ISO 11898-1:2024 §6.6.11.7"
original_wording = "DFs shall be delimited by a flag sequence consisting of seven recessive bits forming the EOF."
shape = "invariant"
scope = "frame"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "An FD DF is being terminated"
postcondition = "The EOF field is exactly seven consecutive recessive bits"
flags = []
notes = "Substantively duplicates REQ-MAC-054 from §6.6.10.7 — same structural rule but for FD DFs (no FD remote frames). Only FB and FE apply."
label = ""
file = ""

