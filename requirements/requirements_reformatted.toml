postcondition = "The receiver does not send a dominant bit (does not acknowledge) in the ACK slot"
flags = []
notes = "The receiver withholds ACK on CRC error, then sends an EF (see REQ-MAC-104/105). All four formats share this rule."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-104"
source_clause = "ISO 11898-1:2024 §6.6.21.3.1"
original_wording = "A receiver receiving a CC frame and detecting an FCRC error shall send an EF starting with the first bit of EOF."
shape = "triggered"
scope = "node"
side = "receiver"
layer = "MAC"
format_applicability = "CB, CE"
precondition = "Error signalling is enabled and a receiver has detected an FCRC error in a CC frame"
event = "The first bit of EOF is reached"
postcondition = "The receiver starts transmitting an error flag at the first bit of EOF"
flags = []
notes = "CC-specific FCRC error response timing. Only CB and CE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-105"
source_clause = "ISO 11898-1:2024 §6.6.21.3.1"
original_wording = "A receiver receiving an FD frame and detecting an FCRC error shall send an EF after three bit-times following the CRC delimiter."
shape = "triggered"
scope = "node"
side = "receiver"
layer = "MAC"
format_applicability = "FB, FE"
precondition = "Error signalling is enabled and a receiver has detected an FCRC error in an FD frame"
event = "Three bit-times after the CRC delimiter have elapsed"
postcondition = "The receiver starts transmitting an error flag"
flags = []
notes = "FD-specific FCRC error response timing — delayed by 3 bit-times after CRC delimiter (covering ACK slot and ACK delimiter). Only FB and FE apply."
label = ""
file = ""

[[requirement]]
id = "REQ-MAC-106"
source_clause = "ISO 11898-1:2024 §6.6.21.3.1"
original_wording = "When error signalling is enabled and a node detects an error during the arbitration phase, the node shall send an EF. ; When a node detects an error while the data phase bit rate is used, the node shall switch from the data bit time back into the nominal bit time of the arbitration phase before it starts the error flag."
shape = "triggered"
scope = "node"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
precondition = "Error signalling is enabled and an error is detected during frame processing"
event = "An error is detected during arbitration phase or data phase"
postcondition = "Arbitration phase error: node sends EF immediately. Data phase error: node switches from data bit rate to nominal bit rate before starting the EF"
flags = ["COMPOUND"]
notes = "COMPOUND: (1) EF on arbitration phase error; (2) bit rate switch before EF on data phase error. The bit rate switch applies only to FD frames with BRS=recessive. All four formats share the arbitration-phase rule; data-phase rule applies to FB and FE with BRS."
