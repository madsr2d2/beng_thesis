source_clause = "ISO 11898-1:2024 §6.6.10.2"
original_wording = "Arbitration between CC frames shall start with the ID28 bit and shall end with the RTR bit. When a node transmits a recessive bus state at one of these bits and samples a dominant bus state, it shall lose arbitration and it shall become receiver of that frame."
shape = "triggered"
scope = "node"
side = "transmitter"
