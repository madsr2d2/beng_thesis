source_clause = "ISO 11898-1:2024 §6.6.4.2"
original_wording = "Frame transmission shall fulfil the following requirements. Transmit data encapsulation: acceptance of LLC frames and interface control information, CRC sequence calculation including stuff bit count for FD frames, construction of MAC frames in the selected format by adding SOF, RRS bit, IDE bit, RTR bit, SRR bit, FDF bit, BRS bit, ESI bit, FCRC, ACK, and EOF to the LLC frame. Transmit medium access management: initiation of the transmission process after recognizing bus idle, serialization of the MAC frame, insertion of stuff bits, arbitration and passing into receive mode in case of loss of arbitration, error detection, ACK checking, recognition of an overload condition, OF and EF construction and initiation, presentation of a serial bit stream to the PMA for transmission, switching of the bit rate for FD frames."
shape = "invariant"
scope = "node"
side = "transmitter"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
