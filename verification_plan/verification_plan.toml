# ── §6.4.1 Overview ──

[[requirement]]
id = "REQ-001"
source_clause = "§6.4.4"
original_wording = "If an LLC sub-layer is restricted to the use of a sub-range of identifiers (e.g. only 11-bit identifiers), then it shall be limited to LLC DFs and LLC RFs with identifiers of that sub-range."
side = "both"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "Assertable at the LLC acceptance filter boundary. If the node only supports 11-bit IDs, frames with IDE=1 shall not pass. All four formats may be affected depending on the restriction."
label = ""
file = ""
observability = "black_box"

[[requirement]]
id = "REQ-002"
source_clause = "§6.4.4"
original_wording = "If an LLC sub-layer is restricted to the use of less than the maximum number of data bytes, then it shall be limited to LLC DFs with several data bytes of that restricted range. ; If the DLC indicates a higher number of data bytes, the data bytes beyond the restricted range shall be replaced in the LLC DF by bytes with the value of CCHEX ('padding') both for received and for transmitted frames."
side = "both"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "Two sub-claims: LLC shall be limited to DFs within the restricted data byte range, and excess bytes shall be padded with 0xCC. The padding behavior is independently assertable. All four formats may carry data payloads subject to this rule."
label = ""
file = ""
observability = "black_box"

[[requirement]]
id = "REQ-003"
source_clause = "§6.4.5.2"
original_wording = "In both cases, the LLC sub-layer shall notify the successful transmission or reception of a DF or RF to the LLC user."
side = "both"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "The notification trigger is the MAC sub-layer transfer status. All four in-scope formats require this notification. RF applies only to CB and CE, but DF notification applies to all four."
label = ""
file = ""
observability = "black_box"

[[requirement]]
id = "REQ-004"
source_clause = "§6.4.5.5.2"
original_wording = "Receipt of this service shall cause the LLC sub-layer to initiate the transfer of an LLC frame by use of the data transfer service provided by the MAC sub-layer (see 6.6)."
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "The initiation of transfer is assertable as a handshake to the MAC sub-layer (§6.6). All four formats use the same initiation path."
label = ""
file = ""
observability = "black_box"

[[requirement]]
id = "REQ-005"
source_clause = "§6.4.5.5.2"
original_wording = "Any L_Data.Request shall be processed not later than the second SOF after the request when there are no EFs present during this time."
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "Liveness with a practical bound: 'not later than the second SOF'. This is not a fixed cycle count — the SOF timing depends on bus activity. Testbench can impose a timeout based on worst-case inter-frame spacing. All four formats share the same timing obligation."
label = ""
file = ""
observability = "white_box"

[[requirement]]
id = "REQ-006"
source_clause = "§6.4.5.5.3"
original_wording = "Receipt of this service shall cause the LLC sub-layer to abort the transfer of an LLC frame in the specified LLC storage unit."
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "The actual abortion may be deferred if the frame is already passed to the MAC sub-layer; this requirement covers the immediate effect of receiving the abort primitive. All four formats use the same abort mechanism."
label = ""
file = ""
observability = "black_box"

[[requirement]]
id = "REQ-007"
source_clause = "§6.4.5.5.3"
original_wording = "Pending transmissions, which are already passed to the MAC sub-layer, shall only be aborted if: an error in the MAC sub-layer during transmission occurs, or arbitration was lost in the MAC sub-layer, which causes the LLC frame to wait for another transmission attempt. ; This means that an abortion request shall be kept pending in the LLC layer until either one of the above situations occur, or until the transmission was completed."
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "Two sub-claims: abort is only triggered on MAC error or arbitration loss, and the abort request stays pending until that condition is met. All four formats share the same abort deferral logic."
label = ""
file = ""
observability = "black_box"

[[requirement]]
id = "REQ-008"
source_clause = "§6.4.5.5.3"
original_wording = "Any L_Data.AbortRequest shall be processed prior to the second SOF after the request when there are no EFs present during this time. ; Any L_Data.AbortRequest shall be processed prior to the third SOF after the request when there are EFs present during this time."
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "Two distinct timing bounds apply depending on whether error frames are present: the abort must be processed by the second SOF without EFs, or by the third SOF when EFs are present. Testbench imposes timeout based on worst-case inter-frame spacing. All four formats share the same timing obligation."
label = ""
file = ""
observability = "white_box"

[[requirement]]
id = "REQ-009"
source_clause = "§6.5.2"
original_wording = "The transmission of frames losing bus arbitration shall be restarted by the LLC entity unless the transmission of that frame is aborted by the LLC user."
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "The arbitration loss event originates from the MAC sub-layer. The restart is called 're-arbitration'. All four formats participate in bus arbitration and are subject to this rule."
label = ""
file = ""
observability = "black_box"

[[requirement]]
id = "REQ-010"
source_clause = "§6.5.3"
original_wording = "The retransmission of frames that are not aborted by the LLC user shall be attempted for the configured specific number of times. ; Retransmission attempts shall be counted in the retransmission counter."
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "Two sub-claims: retransmission is attempted for the configured number of times, and attempts are counted in the retransmission counter. The configured range is 0 (no retransmission) to at least 6, with optional unlimited. All four formats share the same retransmission logic."
label = ""
file = ""
observability = "white_box"

[[requirement]]
id = "REQ-011"
source_clause = "§6.5.4"
original_wording = "Each receiver should decide by frame acceptance filtering whether the frame is relevant or not. ; Acceptance filtering is a frame transaction initiated at the LLC sub-layer, it should be a single, self-contained operation independent of previous frame transactions."
side = "receiver"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "SHOULD: wording uses 'should' (recommendation) not 'shall' (mandatory). Frame acceptance filtering is recommended but not strictly required. All four formats may be subject to filtering."
label = ""
file = ""
observability = "white_box"

[[requirement]]
id = "REQ-012"
source_clause = "§6.5.6"
original_wording = "The LLC sub-layer's transmission service shall report the Transfer_Status of a requested transmission as Ongoing when the MAC has started that transmission. ; It shall report the Transfer_Status as Transmitted when that transmission is successfully completed. ; It shall report the Transfer_Status as Lost_Arbitration when that transmission loses the bus arbitration, until the frame is started again or aborted. ; It shall report the Transfer_Status as Disturbed when that transmission is disturbed by an error or is not acknowledged, until the frame is started again or aborted. ; It shall report the Transfer_Status as Aborted when that transmission is not successful and is not retransmitted because the frame is aborted, or its retransmission limit is reached."
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "Five distinct sub-claims, one per Transfer_Status value: Ongoing when MAC starts, Transmitted on success, Lost_Arbitration on arbitration loss, Disturbed on error or missing ACK, and Aborted when not retransmitted. Each sub-claim is independently assertable. All trigger conditions originate from the MAC sub-layer. All four formats share the same Transfer_Status reporting."
label = ""
file = ""
observability = "black_box"

