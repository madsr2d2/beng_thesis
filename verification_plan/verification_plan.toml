[[requirement]]
id = "REQ-038"
source_clause = "§8.1.5"
original_wording = "If during network start-up only one node is online and if this node transmits any DF or RF, it does not get an ACK. In this case, it shall detect an error and repeat the frame. According to rule c) in 8.1.4.2, exception 1, it may become error-passive but shall not go bus-off. ; When a switched-off node is switched on again, it shall: synchronize with already available nodes to re-integrate into the bus communication (see 6.6.7.5) before starting to transmit. Synchronization is achieved when 11 recessive bits have been detected that are equivalent to ACK delimiter + EOF + intermission or Error/Overload delimiter + intermission; wait for other nodes if there is no other node available at the moment without becoming bus-off."
paraphrase = """1) A node shall complete bus re-integration (11 consecutive recessive bits) before transmitting.
2) A single node that receives no ACK shall become error-passive but shall never go bus-off; the error-passive ACK exception applies indefinitely."""
side = "both"
layer = "system"
format_applicability = "CB, CE, FB, FE"
observability = "black_box"
verification_method = "simulation"
priority             = "P2"
status                = "not_started"
notes = "Sub-claim 1 is an emergent property of REQ-009 (re-integration) and REQ-010 (SOF only when idle); the dedicated test here confirms the node does not transmit before integration completes. Sub-claim 2 requires a single-node scenario where ACK injection is permanently absent, verifying TEC rises to error-passive but does not exceed 255."
label = ""
file = ""
group_title = "Node start-up"

[[requirement]]
id = "REQ-039"
source_clause = "§6.6.18"
original_wording = "MAC frames may be stored in a shared memory. Data consistency of transmitted MAC frames from a shared memory shall be ensured by at least one of two methods. The MAC entity shall store the whole frame content to be transmitted in a temporary buffer that is filled before the transmission is started. The LLC entity shall check for data errors while the frame content to be transmitted is transferred to the MAC entity. If a data error is detected, the transmission shall not be started. If it is already started when the data error is detected, the node shall invalidate the frame by, e.g. switching to the restricted operation mode, see 6.6.19, or into bus monitoring mode, see 6.6.20."
paraphrase = "Transmitted frames shall be protected against mid-transmission corruption by at least one of: (a) buffering the full frame before TX starts, or (b) LLC data-error checking with frame invalidation on detection."
side = "transmitter"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = "Verify by code_inspection which method the implementation uses and confirm it is applied consistently. If method (a) - confirm the MAC FSM only begins serialisation after the full frame is loaded. If method (b) - confirm the LLC has an error-detection path and can abort or invalidate an in-progress frame."
label = ""
file = ""
observability = "white_box"
verification_method = "code_inspection"
priority             = "P2"
status                = "not_started"
group_title = "MAC data consistency"

