[[requirement]]
id = "REQ-032"
source_clause = "§8.1.4.2 rule a), rule b), rule c), rule d), rule e), rule f), rule g), rule h)"
original_wording = "When a receiver detects an error, the receive error counter shall be incremented by 1, except when the detected error is a bit error during the sending of an active error flag or an overload flag. ; When a receiver detects a dominant bit as the first bit after sending an error flag, the receive error counter shall be incremented by 8. ; If a receiver detects a bit error while sending an active error flag or an overload flag, the receive error counter shall be incremented by 8. ; After the successful reception of a frame (reception without error up to the ACK slot and the successful sending of the ACK bit), the receive error counter shall be decremented by 1 if it was between 1 and 127. If the receive error counter was 0, it shall stay at 0, and if it was greater than 127, then it shall be set to a value between 119 and 127. ; When a transmitter sends an error flag, the transmit error counter shall be incremented by 8. ; Exception 1: If the transmitter is error-passive and detects an ACK error because of not detecting a dominant ACK and does not detect a dominant bit while sending its passive error flag. ; Exception 2: If the transmitter sends an error flag because a stuff error occurred before the arbitration is decided, whereby the stuff bit should have been recessive, and after it is sent recessive but is monitored to be dominant. ; In exception 1 and in exception 2, the transmit error counter remains unchanged. ; If a transmitter detects a bit error while sending an active error flag or an overload flag, the transmit error counter shall be incremented by 8. ; After the successful transmission of a frame (getting ACK and no error has been detected until EOF is finished), the transmit error counter shall be decremented by 1 unless it was already 0. ; Any node shall tolerate up to 7 consecutive dominant bits after sending an active error flag, passive error flag, or overload flag. After detecting 14 consecutive dominant bits (in case of an active error flag or an overload flag) or after detecting 8 consecutive dominant bits following a passive error flag, and after each sequence of additional 8 consecutive dominant bits, every transmitter shall increment its transmit error counter by 8 and every receiver shall increment its receive error counter by 8."
paraphrase = "1) +1 on any receiver-detected error (except bit errors during error/overload flag).\n2) +8 on first dominant bit after sending an error flag.\n3) +8 on bit error while sending an active error or overload flag.\n4) -1 on successful RX if in 1-127; stays 0 if already 0; set to 119-127 if above 127.\n5) +8 when sending an error flag (exceptions: error-passive ACK error, pre-arbitration stuff error).\n6) +8 on bit error while sending an active error or overload flag.\n7) -1 on successful TX (floor 0).\n8) After 14 consecutive dominant bits following an active error or overload flag (8 after a passive error flag), increment both counters by 8.\n9) Further +8 for each additional 8 consecutive dominant bits."
side = "both"
layer = "FCE"
format_applicability = "CB, CE, FB, FE"
notes = "Counter values are inferred from error_active/error_passive threshold crossings; the raw TEC and REC values are internal. Rule h requires the '>127 set to 119-127' clamp path to be confirmed, not just the +1 and -1 paths. TEC exception 2 is architecturally handled by the MAC routing c_lost_arb for a recessive stuff bit monitored as dominant during arbitration; no FCE-side exception logic exists for this case. Sub-layer split for rule f: the MAC counts consecutive dominant bits and signals error_delimiter_too_late; the FCE is only responsible for the counter increments. The MAC-side threshold logic (14-bit for active/overload flag, 8-bit for passive flag) is verified by MAC testbenches."
label = "test_rule_a, test_rule_b, test_rule_c, test_rule_c_exception, test_rule_d, test_rule_e, test_rule_f_tx, test_rule_f_rx, test_rule_g, test_rule_h"
file = "src/can_fce/hdl_tb/can_fce_tb.vhd"
observability = "black_box"
verification_method = "simulation"
priority             = "P1"
status                = "in_progress"
group_title = "Error counter rules"

[[requirement]]
id = "REQ-034"
source_clause = "§8.1.4.3, §8.1.4.4, §8.1.3.2"
original_wording = "If the transmit error counter or the receive error counter of a node exceeds 127 (carry condition in case of a 7-bit receive error counter) then the supervisor shall request the MAC sub-layer to set the corresponding node into the error-passive state. ; An error-passive node shall become error-active again when both the transmit error counter and the receive error counter are less than or equal to 127 (see Figure 43). ; If the transmit error counter of a node is greater than 255 (carry condition in case of an 8-bit transmit error counter) then the supervisor shall request the PL to set the node into the bus-off state. A node which is in the bus-off state shall have no influence on the bus. It shall not send any frames nor acknowledge DFs or RFs. Whether or not such a node accepts DFs from the bus depends on the implementation. Upon a restart request, a node which is in the bus-off state shall be re-integrating to the CAN communication (see 6.6.7.5) and may become error-active (no longer bus-off) with its error counters both set to zero after having monitored 128 occurrences of the idle condition (see 3.34) on the bus. ; Table 15: Bus_off — Indicates that the node is in the bus-off state (FCE-to-LLC service interface)."
paraphrase = """1) Either counter exceeding 127 causes error-passive.
2) Both counters at or below 127 restores error-active.
3) TEC exceeding 255 causes bus-off.
4) Bus-off recovery requires 128 idle conditions; both counters reset to zero.
5) FCE shall assert Bus_off notification to the LLC on entering bus-off state."""
side = "both"
layer = "FCE"
format_applicability = "CB, CE, FB, FE"
notes = "test_bus_off covers sub-claims 1, 3, 4, and 5; test_bus_off_recovery covers sub-claims 2 and 4."
label = "test_bus_off, test_bus_off_recovery"
file = "src/can_fce/hdl_tb/can_fce_tb.vhd"
observability = "black_box"
verification_method = "simulation"
priority             = "P1"
status                = "in_progress"
group_title = "Error confinement state transitions"

[[requirement]]
id = "REQ-035"
source_clause = "§6.6.11.3, §7.2.5, §7.2.6"
original_wording = "This bit indicates whether the bit rate is switched inside the FD frame. If the bit is detected recessive, the bit rate shall be switched from the nominal bit rate of the arbitration phase to the preconfigured FD data bit rate of the data phase. It is not required for the BRS bit to be the same in all FD frames in a single network. The value of the BRS bit is passed from the BRS bit of the LLC frame. ; In transmitted FD frames, D_Transmit shall be set to active at the beginning of the FD data phase and it shall be set to passive at the end of the FD data phase or when that frame is disturbed. ; In received FD frames, D_Receive shall be set to active at the beginning of the FD data phase and it shall be set to passive at the end of the FD data phase or when that frame is disturbed."
paraphrase = """1) A recessive BRS bit switches from nominal to FD data rate at the BRS sample point; dominant keeps nominal rate.
2) The bit rate switches back to nominal at the sample point of the first CRC delimiter bit."""
side = "both"
layer = "MAC"
format_applicability = "FB, FE"
observability = "white_box"
verification_method = "waveform_inspection"
priority             = "P1"
status                = "not_started"
notes = "The actual rate switch is executed by the PCS on the use_data_rate signal driven by the MAC FSM. Verification confirms the FSM both asserts use_data_rate at the BRS sample point (sub-claim 1) and de-asserts it at the CRC delimiter sample point (sub-claim 2). REQ-023 covers de-assertion on the error/disturbed path."
label = ""
file = ""
group_title = "BRS bit rate switching"

[[requirement]]
id = "REQ-036"
source_clause = "§6.4.3, §6.4.4, Table 5"
original_wording = "For DFs of all other formats the 4 LSB encode the number of data bytes as specified in Table 5. ; If the DLC indicates a higher number of data bytes, the data bytes beyond the restricted range shall be replaced in the LLC DF by bytes with the value of CCHEX ('padding') both for received and for transmitted frames."
paraphrase = """1) DLC 0-8 map linearly; FD extends DLC 9→12, 10→16, 11→20, 12→24, 13→32, 14→48, 15→64 bytes; CC treats DLC 9-15 as 8 bytes.
2) An LLC restricted to fewer bytes shall replace excess bytes with 0xCC padding in both TX and RX directions."""
side = "both"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
observability = "black_box"
verification_method = "simulation, coverage"
priority             = "P1"
status                = "not_started"
notes = "Coverage closure criterion: all four non-linear FD DLC values (9, 12, 14, 15 → 12, 24, 48, 64 bytes) plus DLC=8 (boundary) must each produce a correctly sized frame. Sub-claim 2 (0xCC padding) is P3 and only applies if the implementation exposes a configurable maximum-data-byte restriction; verify only if that feature is implemented."
label = ""
file = ""
group_title = "DLC byte-count mapping"

