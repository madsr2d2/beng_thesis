format_applicability = "FB, FE"
notes = ""
label = "test_normal"
file = "can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "waveform_inspection"
priority             = "P2"
status                = "in_progress"
group_title = "ESI bit transmission"

[[requirement]]
id = "REQ-017"
source_clause = "§6.6.11.5"
original_wording = "In FD frames, the stuff count shall be at the beginning of the CRC field. It shall represent a number in the range from 0 to 7d (Gray-coded in SBC3, SBC2, and SBC1; followed by the parity bit SBC0) as specified in Table 8. ; Both transmitter and receivers of a frame shall count the number of stuff bits before the first fixed stuff bit in the frame. The transmitter shall transmit its stuff bit count, coded as stuff count, at the beginning of the CRC field, before the FCRC sequence. Receivers shall check whether the received stuff count matches with the value calculated from their own stuff bit count."
paraphrase = "The SBC field shall be Gray-coded with a parity bit and placed before the FCRC, encoding the count of dynamic stuff bits in the frame."
side ="both"
layer = "MAC"
format_applicability = "FB, FE"
notes = ""
label = "p_sbc_checker"
file = "src/can_mac_bs/hdl_tb/can_mac_bs_tb.vhd"
observability = "black_box"
verification_method = "simulation"
priority             = "P1"
status                = "in_progress"
group_title = "Stuff count (SBC) field"


[[requirement]]
id = "REQ-018"
source_clause = "§6.6.10.5, §6.6.11.5"
original_wording = "The CRC delimiter shall follow the FCRC sequence. In CC frames, the CRC delimiter is one single recessive bit. ; In FD frames, the CRC delimiter may consist of one or two recessive bits. A transmitter shall send one recessive bit as CRC delimiter, but it shall accept two recessive bits before the edge from recessive to dominant that starts the acknowledge slot."
paraphrase = """1) CC frames: exactly one recessive CRC delimiter bit.
2) FD frames: transmitter sends one recessive bit; a second recessive bit is tolerated before the ACK slot."""
side = "transmitter"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = "The FD second-recessive-bit tolerance is provided by the 2-bit FD ACK window in s_ack, not by waiting an extra bit in s_crc_delimiter. The CC sub-claim (sub-claim 1) is a fixed-form bit; a dominant CC CRC delimiter is caught by REQ-028."
label = "p_fsm:~768, p_fsm:~796, test_normal"
file = "src/can_mac/hdl_src/can_mac_fsm.vhd, can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "code_inspection, waveform_inspection"
priority             = "P2"
status                = "in_progress"
group_title = "CRC delimiter"

[[requirement]]
id = "REQ-019"
source_clause = "§6.6.13.1, §6.6.13.2, §6.6.13.3.1"
original_wording = "The frame segments from SOF to the frame FCRC sequence shall be coded by the method of the bit stuffing. The remaining bit fields of the frame (ACK field, EOF) shall not be stuffed. ; Dynamic bit stuffing shall be used in CC frames from the SOF up to and including the FCRC sequence. Dynamic bit stuffing shall be used in FD frames from the SOF up to and including the data field. ; Whenever a transmitter detects five consecutive bits (including dynamic stuff bits) of the identical value in the bit stream to be transmitted, it shall insert a complementary bit (called dynamic stuff bit) into the actual transmitted bit stream. The receiver shall recognize a sequence of five consecutive bits of identical value and shall discard the following dynamic stuff bit. ; In the CRC field of FD frames, the stuff bits shall be inserted at fixed positions; they are called fixed stuff bits. There shall be a fixed stuff bit before the first bit of the stuff count, even if the last bits of the preceding field are not a sequence of five consecutive bits of identical value. If the last bits of the preceding field are a sequence of five consecutive bits of identical value, there shall be only the fixed stuff bit, there shall not be two consecutive stuff bits. A further fixed stuff bit shall be inserted after each fourth bit of the CRC field. The value of such a fixed stuff bit shall be the inverse value of the bit preceding the fixed stuff bit. ; A receiver shall discard the fixed stuff bits from the bit stream for the CRC check. It shall detect a form error if the fixed stuff bit has the same value as its preceding bit."
paraphrase = """1) After 5 consecutive identical bits, a complementary dynamic stuff bit shall be inserted; the receiver shall discard it.
2) CC stuffing covers SOF through the FCRC sequence; FD dynamic stuffing covers SOF through the data field only.
3) The ACK field and EOF shall not be dynamically stuffed.
4) FD frames (FB, FE): a fixed stuff bit precedes the SBC field and follows every fourth CRC bit, each the inverse of the preceding bit. If the preceding field ends with 5 consecutive identical bits, only the FSB is emitted. A receiver detecting a fixed stuff bit with the same polarity as the preceding bit shall flag a form error."""
side = "both"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = "Coverage closure criterion for dynamic stuffing: four bins - (1) CB with a stuff bit inserted, (2) CE with a stuff bit inserted, (3) FB with stuffing halting at the data/CRC boundary, (4) FE with the same. Coverage closure criterion for fixed stuffing (FB, FE only): four format-by-CRC-length bins - (1) FB with CRC_17, (2) FE with CRC_17, (3) FB with CRC_21, (4) FE with CRC_21 - plus at least one frame exercising the no-double-stuffing rule."
label = "p_stuff_bit_checker, p_fsb_checker"
file = "src/can_mac_bs/hdl_tb/can_mac_bs_tb.vhd"
observability = "white_box"
verification_method = "simulation, coverage"
priority             = "P1"
status                = "in_progress"
group_title = "Bit stuffing"

[[requirement]]
id = "REQ-020"
source_clause = "§6.6.10.7, §6.6.11.7, §6.6.15.2"
original_wording = "DFs and RFs shall be delimited by a flag sequence consisting of seven recessive bits forming the EOF. EOF is followed by inter-frame space, see 6.6.7. ; DFs shall be delimited by a flag sequence consisting of seven recessive bits forming the EOF. The inter-frame space follows the EOF (see 6.6.7). ; The frame shall be valid for receivers if there is no error until the last but one bit of EOF. The value of the last bit of EOF shall not inhibit frame validation and a dominant value shall not lead to a form error. A receiver that detects a dominant bit at the last bit of EOF shall respond with an OF (see 6.6.21). The frame shall be valid for a transmitter if there is no error until the end of EOF."
paraphrase = """1) EOF shall consist of exactly 7 recessive bits.
2) A receiver shall validate a frame after the sixth EOF bit.
3) A dominant seventh EOF bit triggers an OF rather than a form error.
4) A transmitter requires all seven EOF bits to be error-free."""
side = "both"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = "Coverage closure criterion: three bins - (1) successful TX closure across all four formats, (2) successful RX validation across all four formats, (3) dominant seventh EOF bit triggering an OF rather than a form error."
label = "test_normal"
file = "can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "simulation, coverage"
priority             = "P1"
status                = "in_progress"
group_title = "End of frame (EOF)"

[[requirement]]
id = "REQ-021"
source_clause = "§6.6.10.2, §6.6.11.2, §6.6.17.4, §6.6.17.5"
original_wording = "During arbitration, every transmitter shall compare the level of the bit transmitted with the level monitored on the bus. If these levels are equal, the transmitter may continue to send. When a CAN node sends a recessive level and monitors a dominant level, the CAN node loses arbitration and shall withdraw from transmitting any more bits, and it shall become receiver of this frame. ; When a dominant level is sent and a recessive level is monitored, the node shall detect a bit error. ; Identifier based arbitration shall be performed in CBFF from the first bit of the identifier up to the IDE bit, in CEFF from the first bit of the identifier up to the RTR bit, and in FBFF, FEFF, as well as in XLFF from the first bit of the identifier up to the bit following the FDF bit. ; Among two or more frames with different identifiers, the identifier-based arbitration assigns the higher priority to the identifier containing the lower binary value. If one DF in CBFF, one DF in FBFF, and one DF in XLFF with the same identifier are initiated at the same time, the DF in FBFF has a lower priority than the DF in CBFF, and the DF in XLFF has a lower priority than the DF in FBFF and the DF in CBFF. ; The recessive values of SRR and IDE bit ensure that collisions between a frame in CBFF or FBFF and a frame in CEFF or FEFF, with both frames having the same base identifier, are resolved such that the frame in CBFF or FBFF prevails over the frame in CEFF or FEFF. ; The recessive value of the RTR bit in RFs ensure that collisions between a DF and an RF having the same identifier and format are resolved such that the DF prevails over the RF."
paraphrase = """1) Recessive-sent, dominant-monitored: lose arbitration and become a receiver.
2) Dominant-sent, recessive-monitored: bit error.
3) Arbitration spans from the first ID bit to: IDE (CB), RTR (CE), or the bit after FDF (FB/FE).
4) When CB and FB frames with the same base ID collide, the CB frame wins via its dominant r0/FDF bit.
5) When a CBFF/FBFF and CEFF/FEFF frame with the same 11-bit base ID collide, the CBFF/FBFF frame wins via the recessive SRR/IDE bits.
6) When a DF and RF with the same ID and format collide, the DF wins via its dominant RTR bit."""
side = "transmitter"
layer = "system"
format_applicability = "CB, CE, FB, FE"
notes = ""
label = "test_lost_arb"
file = "can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "black_box"
verification_method = "simulation"
priority             = "P1"
status                = "in_progress"
group_title = "Bus arbitration"

[[requirement]]
id = "REQ-022"
source_clause = "§6.6.21.2"
original_wording = "A node sending a bit on the bus shall also monitor the bus. A bit error shall be detected at that bit time, when the bit value that is monitored differs from the bit value sent. ; Exception 1: A monitored dominant bit shall not lead to a bit error when a recessive bit, which is not a dynamic stuff bit, is sent during arbitration, or a recessive bit is sent during ACK slot. ; Exception 2: A node sending a passive error flag and detecting a dominant bit shall not interpret this as a bit error. ; A stuff error shall be detected at the bit time of the sixth consecutive equal bit level in a field that is coded by the method of dynamic bit stuffing. ; A form error shall be detected in the following cases: when a fixed form bit field contains one or more unexpected bit values, or when a fixed stuff bit in an XL frame or in an FD frame is not at its expected value. ; Exception 1: A receiver detecting a dominant bit at the last bit of EOF, or a node detecting a dominant bit at the last bit of the error delimiter or of the overload delimiter, shall not treat this as a form error. ; The receivers shall calculate the CRC in the same way as the transmitter. ; A receiver shall detect an FCRC error when the calculated frame FCRC sequence does not equal the received one, or when the SBC of an FD frame does not match to the number of the received dynamic stuff bits, or when the SBC parity does not match. ; A transmitter shall detect an ACK error whenever it does not detect a dominant bit during the ACK slot."
paraphrase = """1) Bit error: any sent/monitored mismatch. Exceptions: recessive non-stuff bits during arbitration or ACK slot; dominant bits monitored while sending a passive error flag.
2) Stuff error: detected at the sixth consecutive identical bit in any dynamically-stuffed field.
3) Form error: any unexpected fixed-form bit value or wrong fixed stuff bit polarity (FB, FE). Exception: a dominant bit at the last EOF bit or last delimiter bit is not a form error.
4) CRC error: FCRC mismatch; FD frames additionally require SBC match and correct SBC parity.
5) ACK error: transmitter detects no dominant bit in the ACK slot."""
side = "both"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = "The consecutive-bit counter must not run in the fixed-stuffing CRC region of FD frames. For FD frames the SBC comparison and SBC parity check are separate sub-claims from the FCRC comparison. Bit error exceptions (arbitration and ACK slot) are verified by code_inspection; the waveform_inspection label confirms the error-flag transition in test_bus_off."
label = "p_fsm:~283, p_fsm:~336, p_fsm:~343, p_fsm:~415, test_bus_off"
file = "src/can_mac/hdl_src/can_mac_fsm.vhd, can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "code_inspection, waveform_inspection"
priority             = "P1"
status                = "in_progress"
group_title = "MAC error detection"

[[requirement]]
id = "REQ-023"
source_clause = "§6.6.21.3.1"
original_wording = "Whenever a bit error, a stuff error, a form error, a PCRC error, or an ACK error is detected by a node, the LLC sub-layer shall be informed, and the node shall start an error flag at the following bit. ; When error signalling is enabled and a node detects an error during the arbitration phase, the node shall send an EF. ; When a node detects an error while the data phase bit rate is used, the node shall switch from the data bit time back into the nominal bit time of the arbitration phase before it starts the error flag. ; When a receiver detects an FCRC error, it shall not send a dominant bit in the ACK slot of the received frame. A receiver receiving a CC frame or an XL frame and detecting an FCRC error shall send an EF starting with the first bit of EOF. A receiver receiving an FD frame and detecting an FCRC error shall send an EF after three bit-times following the CRC delimiter."
paraphrase = """1) On any detected error, start an EF at the immediately following bit and inform the LLC.
2) Data-phase errors require a switch back to nominal bit rate before the EF starts.
3) On an FCRC error, the receiver shall withhold ACK.
4) On an FCRC error, the receiver sends an EF at the first EOF bit (CC) or 3 bit-times after the CRC delimiter (FD)."""
side = "both"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = "PCRC error (XL-only) is out of scope. Sub-claims 3 and 4 (FCRC error receiver behaviour) were previously P2; promoted to P1 on merge."
label = "p_fsm:~283, p_fsm:~294, p_fsm:~357, test_bus_off"
file = "src/can_mac/hdl_src/can_mac_fsm.vhd, can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "code_inspection, waveform_inspection"
priority             = "P1"
status                = "in_progress"
group_title = "Error flag initiation and FCRC error behaviour"


[[requirement]]
id = "REQ-024"
source_clause = "§6.6.21.3.2"
original_wording = "The following conditions shall lead to the transmission of an OF. a) LLC-requested OF (initiated by the LLC sub-layer): An LLC may cause an OF transmission, when internal conditions of the receiver need a delay of the next MAC DF or MAC RF. b) Reactive OF (initiated by the MAC sub-layer): Detection of a dominant bit during either of the first two bits of intermission, detection of one dominant bit at the last bit of EOF by a receiver, or detection of one dominant bit by any node at the last bit of error delimiter or overload delimiter shall cause an OF transmission. ; An LLC-requested OF shall only be started at the first bit of an expected intermission, whereas reactive OFs shall start one bit after detecting the dominant bit due to condition b) above. The start of LLC-requested OFs due to condition a) above shall be allowed but are not required to be implemented. At most, two LLC requested OFs shall be generated to delay the next MAC DF or MAC RF."
paraphrase = """1) LLC-requested OF: starts at the first intermission bit; optional, at most 2 per inter-frame space.
2) Reactive OF: triggered by a dominant bit at either of the first two intermission bits, the last EOF bit (receivers only), or the last error/overload delimiter bit; starts one bit after the triggering bit."""
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = ""
label = "p_fsm:~370"
file = "src/can_mac/hdl_src/can_mac_fsm.vhd"
side = "both"
observability = "white_box"
verification_method = "code_inspection, waveform_inspection"
priority             = "P2"
status                = "in_progress"
group_title = "Overload frame"

[[requirement]]
id = "REQ-025"
source_clause = "§7.3.2, §7.3.3"
original_wording = "CAN nodes shall support three different bit rates, the nominal bit rate, the FD data bit rate and the XL data bit rate. There shall be separate configuration register sets for the definition of these bit rates. ; The time quantum (t_q) shall be a fixed unit of time derived from the node clock period. There shall exist a programmable prescaler, with integer values. The minimum time quantum (t_q,min) shall be one node clock period long. The length of t_q shall be an integer multiple m of the minimum time quantum t_q,min with m as the value of the prescaler. ; The sample point shall be the point in time at which the bus level is read and interpreted as the value of that respective bit. Its location shall be at the end of Phase_Seg1. ; The synchronization segment shall be exactly one t_q long. ; The information processing time shall be less than or equal to 2 t_q long. ; In nominal bit time and in data bit time, SJW shall be less than or equal to the minimum of these two items: Phase_Seg1 and Phase_Seg2. ; In data bit time, Phase_Seg2 shall be greater than or equal to these two items: SJW and the maximum information processing time."
paraphrase = """1) Separate nominal and FD data bit rate configurations (XL excluded), each based on a programmable integer prescaler.
2) Sample point shall be at the end of Phase_Seg1.
3) Sync_Seg shall be exactly 1 tq.
4) IPT ≤ 2 tq; SJW ≤ min(Phase_Seg1, Phase_Seg2) in both phases.
5) In FD data bit time, Phase_Seg2 ≥ SJW and ≥ maximum IPT."""
layer = "PCS"
format_applicability = "CB, CE, FB, FE"
notes = "XL data bit rate (third configuration set) is out of scope."
label = "test_normal"
file = "src/can_pcs/hdl_tb/can_pcs_tb.vhd"
side = "both"
observability = "white_box"
verification_method = "simulation"
priority             = "P1"
status                = "in_progress"
group_title = "PCS bit timing configuration"

[[requirement]]
id = "REQ-026"
source_clause = "§7.3.2"
original_wording = "The propagation segment t_prop_seg shall be programmed to be at least as long as the sum of the propagation delay times in the network (Formula 2): t_prop_seg(min) >= t_node(A) + t_node(B) + 2 x t_busline. The node delay t_node comprises the internal transmitter and receiver delays of the node, including delays introduced by the transceiver."
paraphrase = "prop_seg ≥ t_node(A) + t_node(B) + 2 × t_busline, where each node delay includes transceiver round-trip delay."
layer = "system"
side = "both"
format_applicability = "CB, CE, FB, FE"
observability = "black_box"
verification_method = "simulation, coverage"
priority             = "P2"
status                = "in_progress"
notes = "Coverage closure criterion: five delay-sweep bins - (transceiver_d=50 ns, bus_d=300 ns) down to (10 ns, 60 ns) - must each yield successful frame exchange."
label = "test_delay_sweep"
file = "can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
group_title = "Propagation segment sizing"

[[requirement]]
id = "REQ-027"
source_clause = "§7.3.4, §6.6.21.3.1"
original_wording = "Nodes that support the FD frame format and nodes that support the XL frame format shall support a transmitter delay compensation mechanism. ; Transmitters shall only use this mechanism in the XL data phase of XL frames when error signalling is enabled or in the FD data phase of FD frames if the BRS bit is recessive. It shall be programmable whether the mechanism is used. When this mechanism is used, the value of the prescaler m shall be one or two. ; The position of the SSP is specified by its distance from the start of the bit time. The SSP position shall be set to a value derived from a measurement of the actual transmitter delay. ; The measurement of the transmitter delay shall be done in each transmitted frame at the recessive to dominant edge from the FDF bit to the res bit in FD frames and at the recessive to dominant edge from the XLF bit to the resXL bit in XL frames. Application of the measured value for the SSP position is done at the data phase of the same frame. ; A counter shall be started when the transmitter starts to transmit the dominant res bit in FD frames or the resXL bit in XL frames at the transmit output. The counter shall be incremented by one each minimum time quantum until the dominant signal is detected at the receive input; then the counter shall be stopped. The counter value is the measured transmitter delay time. The SSP position shall be the sum of the measured transmitter delay value and the configured SSP offset."
paraphrase = """1) FD-capable nodes shall implement TDC for the FD data phase when BRS is recessive, with programmable enable and prescaler constrained to 1 or 2.
2) SSP position = measured transmitter delay + configured offset.
3) When TDC is active, bit errors at the regular SP are ignored; errors at the SSP are reacted upon at the following nominal SP."""
layer = "PCS"
format_applicability = "FB, FE"
notes = ""
label = "p_check_tdc_delay"
file = "src/can_pcs/hdl_tb/can_pcs_tb.vhd"
side = "transmitter"
observability = "black_box"
verification_method = "simulation"
priority             = "P1"
status                = "in_progress"
group_title = "Transmitter delay compensation"

[[requirement]]
id = "REQ-028"
source_clause = "§7.3.5.1, §7.3.5.3, §7.3.5.4"
original_wording = "Only one synchronization within one bit time (between two sample points) shall be allowed. After an edge is detected, synchronizations shall be disabled until the next time the bus state detected at the sample point is recessive. ; An edge shall cause synchronization only if the bus state detected at the previous sample point (previous read bus state) was recessive. If a transmitter uses the transmitter delay compensation (see 7.3.4), also the first detected edge from recessive to dominant after the sample point of the CRC delimiter shall cause synchronization. In this case, CAN nodes may choose alternatively to synchronize on the first detected edge from recessive to dominant seen by an amount of at least the transmitter delay plus one time quantum after the sample point of the CRC delimiter. An edge with a positive phase error (see 7.3.5.2) shall not cause synchronization in a node sending a dominant bit. ; Hard synchronization shall be performed: on edges during inter-frame space (with the exception of the first bit of intermission); when a node is in bus-integration state; at the edge between the FDF bit and the following dominant res bit inside an FD frame; when a node is a receiver of an XL frame, at the edge between the XLF bit and the following dominant resXL bit; at the edge between the DH1 and DH2 bits and the DL1 bit; at the edge between the DAH or AH1 bit and the AL1 bit. ; All other recessive to dominant edges fulfilling rules a) and b) shall be used for resynchronization with one exception: A node transmitting an FD frame or an XL frame shall not synchronize while it transmits the data phase of that frame. ; After a hard synchronization, the bit time shall be restarted by each bit-timing logic unit with Sync_Seg completed. Thus, hard synchronization shall force the edge which has caused the hard synchronization to lie within the synchronization segment of the restarted bit time. The function of hard synchronization shall not be limited by the synchronization jump width. ; When the magnitude of the phase error of the edge which causes resynchronization is less than or equal to the programmed value of the synchronization jump width, the effect of a resynchronization shall be the same as a hard synchronization. ; When the magnitude of the phase error is larger than the programmed value of the synchronization jump width, and if the phase error e is positive, Phase_Seg1 shall be lengthened by an amount equal to the synchronization jump width; and if the phase error e is negative, then Phase_Seg2 shall be shortened by an amount equal to the synchronization jump width."
paraphrase = """1) Only one synchronisation per bit time; re-enabled after the next recessive sample point.
2) Edges qualify only if the previous sample point was recessive and no positive phase error exists while sending dominant.
3) Hard synchronisation occurs on IFS edges, during bus-integration, and at the FDF-to-res transition; correction is unconstrained by SJW and restarts the bit time with Sync_Seg completed.
4) All other qualifying edges cause resynchronisation (except during FD data phase): Phase_Seg1 is lengthened by SJW on a positive phase error, Phase_Seg2 is shortened by SJW on a negative phase error; when error ≤ SJW the effect equals hard synchronisation."""
layer = "PCS"
format_applicability = "CB, CE, FB, FE"
notes = ""
label = "p_can_pcs:~177, p_can_pcs:~228, test_normal"
file = "src/can_pcs/hdl_src/can_pcs.vhd, src/can_pcs/hdl_tb/can_pcs_tb.vhd"
side = "both"
observability = "white_box"
verification_method = "code_inspection, waveform_inspection"
priority             = "P1"
status                = "in_progress"
group_title = "PCS synchronisation"

[[requirement]]
id = "REQ-029"
source_clause = "§7.3.6"
original_wording = "The tolerance of a node clock oscillator frequency f_osc around the nominal frequency f_nom shall be given by the range (1-df)*f_nom <= f_osc <= (1+df)*f_nom. The maximum tolerance df of f_osc shall meet the following conditions: df < SJW(N) / (2 * 10 * tbit(N)) [Eq. 3]; df < min[Phase_Seg1(N), Phase_Seg2(N)] / (2 * [13 * tbit(N) - Phase_Seg2(N)]) [Eq. 4]. The conditions given in Formulae (3) and (4) shall be met for CC frames. All conditions of Formulae (3) to (7) shall be met for FD frames. The configured SJW shall not be larger than the smaller one of the Phase_Seg1 and Phase_Seg2."
paraphrase = """1) df < SJW / (20 × tbit) and df < min(Phase_Seg1, Phase_Seg2) / (2 × (13 × tbit − Phase_Seg2)).
2) SJW shall not exceed min(Phase_Seg1, Phase_Seg2)."""
layer = "PCS"
side = "both"
format_applicability = "CB, CE, FB, FE"
notes = "Two PCS instances run with a clock offset at the maximum ISO 7.3.6 tolerance (df = 0.2% from Eq. 3, SJW=4, N=100), alternating TX/RX roles each frame. XL data rate conditions (Eq. 8) are out of scope."
label = "test_normal"
file = "src/can_pcs/hdl_tb/can_pcs_tb.vhd"
observability = "black_box"
verification_method = "simulation"
priority             = "P2"
status                = "in_progress"
group_title = "Oscillator frequency tolerance"

[[requirement]]
id = "REQ-030"
source_clause = "§6.6.7.5, §7.4.2.2, §7.4.2.3, §8.1.4.4"
original_wording = "A node which is in the bus-off state shall have no influence on the bus. It shall not send any frames nor acknowledge DFs or RFs. ; There shall be a bit counter that is reset when the bus re-integration state is started or when the CAN bus is detected dominant at the sample point. The bit counter shall be incremented when the CAN bus is detected recessive at the sample point. The idle condition shall be detected when this bit counter reaches the value 11. ; The PCS shall send a bus_off symbol to the PMA sub-layer, when it receives a bus_off_request from the supervisor (see 8.1.3.4). ; The PCS shall send a bus_off_release symbol to the PMA sub-layer when it receives a bus_off_release_request from the supervisor (see 8.1.3.4)."
paraphrase = """1) During bus-off, the PCS shall not drive dominant bits.
2) The PCS counts consecutive recessive bits at the sample point and strobes idle_condition after 11, resetting on any dominant.
3) The PCS shall disconnect the node from the bus on a bus_off_request.
4) The PCS shall reconnect on a bus_off_release_request."""
layer = "system"
side = "both"
format_applicability = "CB, CE, FB, FE"
notes = "The FCE-side idle condition counting and bus-off state transition are covered by REQ-034."
label = "test_bus_off"
file = "src/can_pcs/hdl_tb/can_pcs_tb.vhd, can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "black_box"
verification_method = "simulation"
priority             = "P1"
status                = "in_progress"
