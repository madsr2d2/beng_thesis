# verification_plan.toml — ISO 11898-1 CAN verification requirements
#
# Fields per  entry:
#
#   id                   REQ-NNN (sequential, managed by --renumber)
#   source_clause        ISO 11898-1 section reference (e.g. §6.4.5.2)
#   original_wording     Verbatim ISO text; use " ; " to separate sub-clauses
#   paraphrase           Concise restatement for the report table
#   layer                LLC | MAC | PCS | FCE | system
#   side                 transmitter | receiver | both
#   format_applicability Comma-separated subset of: CB, CE, FB, FE
#   observability        black_box | white_box
#                          black_box  — verified purely at the sub-module's ports
#                          white_box  — requires internal signals, FSM state, or
#                                       a non-trivial reference computation
#   verification_method  simulation | code_inspection | waveform_inspection |
#                        coverage | or comma-separated combination
#                          simulation          — automated TB assertion, fires every run
#                          code_inspection     — RTL review; label/file point to RTL source
#                          waveform_inspection — manual GTKWave review of simulation output;
#                                               label points to TB procedure, file points
#                                               to the .gtkw save file
#                          coverage            — coverage-driven sweep; label/file point to
#                                               coverage ID or bin set in the TB
#   priority             P1 | P2 | P3
#                          P1 — need-to-have; blocking ("shall" requirements, core correctness)
#                          P2 — nice-to-have; verified in the normal verification cycle
#                          P3 — optional; verified if schedule permits ("should" clauses)
#   status               not_started | in_progress | complete
#                          not_started — no testbench work started (label/file blank)
#                          in_progress — testbench exists but closure not confirmed
#                          complete    — all listed label/file procedures pass
#   label                PSL label, TB procedure name, coverage ID, or RTL tag
#                        For code_inspection: process_name:~line (e.g. p_can_pcs:~177)
#                        Comma-separated when multiple procedures cover distinct sub-claims
#   file                 Target file — TB for simulation/coverage/waveform_inspection,
#                        RTL for code_inspection (blank until linked)
#                        Comma-separated when sub-claims span multiple files
#   notes                How it is verified; relevant caveats and sub-claim breakdown
#
# Layer "system": requirements jointly owned by multiple sub-layers, or that
# inherently require two nodes on the shared bus. Verified by integration TBs.
#
# XL frames are strictly OUT OF SCOPE — do not add XL-related requirements.

[[requirement]]
id = "REQ-001"
source_clause = "§6.4.5.2, §6.5.7, §6.6.3"
original_wording = "In both cases, the LLC sub-layer shall notify the successful transmission or reception of a DF or RF to the LLC user. ; For the capturing of time stamps, the LLC may provide a cross-layer function interface to a time-base that is outside the DLL. The time-base and time-stamps shall have a length of 64 bit. When time-stamping is not supported, time-base and time-stamps shall be treated as constants with the value 0. ; Any DF or RF received or transmitted by the MAC sub-layer shall cause a notification to be sent from the MAC sub-layer to the LLC sub-layer to signal a time reference point for the capture of the time-base as a timestamp. Time reference points shall be signalled both at the sample point of the SOF bit and at the sample point of the bit of the frame when that frame gets valid."
paraphrase = """1) LLC shall notify the user on every successful DF/RF TX or RX.
2) MAC shall signal time reference points at the SOF sample point and the frame-valid sample point.
3) If timestamping is absent, all timestamp outputs shall be constant zero."""
side = "both"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "Sub-claim 2 (§6.6.3 dual time reference points) is the MAC-side trigger; sub-claim 3 is P3 and verified by code_inspection: confirm that timestamp outputs are tied to 0 when the timestamping feature is absent."
label = ""
file = ""
observability = "black_box"
verification_method = "simulation, code_inspection"
priority             = "P1"
status                = "not_started"
group_title = "LLC notification and timestamping"

[[requirement]]
id = "REQ-002"
source_clause = "§6.4.5.5.2, §6.4.5.5.3"
original_wording = "Any L_Data.Request shall be processed not later than the second SOF after the request when there are no EFs present during this time. ; Receipt of this service shall cause the LLC sub-layer to abort the transfer of an LLC frame in the specified LLC storage unit. ; Pending transmissions, which are already passed to the MAC sub-layer, shall only be aborted if: an error in the MAC sub-layer during transmission occurs, or arbitration was lost in the MAC sub-layer, which causes the LLC frame to wait for another transmission attempt. ; This means that an abortion request shall be kept pending in the LLC layer until either one of the above situations occur, or until the transmission was completed. ; Any L_Data.AbortRequest shall be processed prior to the second SOF after the request when there are no EFs present during this time. ; Any L_Data.AbortRequest shall be processed prior to the third SOF after the request when there are EFs present during this time."
paraphrase = """1) A TX request shall be processed no later than the second SOF after the request when no EFs are present.
2) Frames not yet passed to the MAC are aborted immediately.
3) Frames already at the MAC are only aborted on MAC error or arbitration loss.
4) An abort request shall be processed before the second SOF (no EFs) or third SOF (with EFs)."""
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "The timing bounds ('second SOF', 'third SOF') are bus-activity-dependent, not fixed cycle counts. The two-SOF and three-SOF deadlines for abort requests govern the LLC-to-MAC handoff, not MAC transmission duration."
label = ""
file = ""
observability = "white_box"
verification_method = "code_inspection"
priority             = "P2"
status                = "not_started"
group_title = "LLC transmission request and abort timing"

[[requirement]]
id = "REQ-003"
source_clause = "§6.5.2, §6.5.3"
original_wording = "The transmission of frames losing bus arbitration shall be restarted by the LLC entity unless the transmission of that frame is aborted by the LLC user. ; The retransmission of frames that are not aborted by the LLC user shall be attempted for the configured specific number of times. ; Retransmission attempts shall be counted in the retransmission counter. ; The node's retransmission counter shall be reset to zero when a transmission is successful or when the LLC user requests a new transmission. ; Nodes that do not support the XL frame format are not required to implement the retransmission counter, but they shall support unlimited retransmissions."
paraphrase = """1) Frames losing arbitration shall be retransmitted up to the configured limit unless aborted.
2) Non-XL nodes need not implement a retransmission counter but shall support unlimited retransmissions.
3) If implemented, the retransmission counter shall reset to zero on successful TX or on a new LLC TX request."""
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "§6.5.3 last sentence explicitly exempts non-XL nodes from implementing the counter while mandating unlimited retransmission support. Sub-claim 3 guards against counter bleed-over only when a counter is present. Retransmission limit range (0 to ≥6, optional unlimited) applies only to nodes that implement the counter."
label = ""
file = ""
observability = "white_box"
verification_method = "code_inspection"
priority             = "P1"
status                = "not_started"
group_title = "Retransmission"

[[requirement]]
id = "REQ-004"
source_clause = "§6.5.4"
original_wording = "Each receiver should decide by frame acceptance filtering whether the frame is relevant or not. ; Acceptance filtering is a frame transaction initiated at the LLC sub-layer, it should be a single, self-contained operation independent of previous frame transactions."
paraphrase = """1) Receivers should use acceptance filtering to decide frame relevance.
2) Filtering shall be a single self-contained operation with no state carry-over from previous frames."""
side = "receiver"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = "P3 recommendation ('should'). Filter must be a single self-contained operation with no carry-over state from previous frame transactions."
label = ""
file = ""
observability = "white_box"
verification_method = "code_inspection"
priority             = "P3"
status                = "not_started"
group_title = "Frame acceptance filtering"

[[requirement]]
id = "REQ-005"
source_clause = "§6.5.6"
original_wording = "The LLC sub-layer's transmission service shall report the Transfer_Status of a requested transmission as Ongoing when the MAC has started that transmission. ; It shall report the Transfer_Status as Transmitted when that transmission is successfully completed. ; It shall report the Transfer_Status as Lost_Arbitration when that transmission loses the bus arbitration, until the frame is started again or aborted. ; It shall report the Transfer_Status as Disturbed when that transmission is disturbed by an error or is not acknowledged, until the frame is started again or aborted. ; It shall report the Transfer_Status as Aborted when that transmission is not successful and is not retransmitted because the frame is aborted, or its retransmission limit is reached."
paraphrase = "LLC shall report five transfer status values: Ongoing, Transmitted, Lost_Arbitration, Disturbed, and Aborted, each reflecting the corresponding MAC sub-layer event."
side = "transmitter"
layer = "LLC"
format_applicability = "CB, CE, FB, FE"
notes = ""
label = ""
file = ""
observability = "black_box"
verification_method = "simulation"
priority             = "P1"
status                = "not_started"
group_title = "LLC transfer status reporting"

[[requirement]]
id = "REQ-006"
source_clause = "§6.6.4.4"
original_wording = "The first polynomial, CRC_15, shall be used for CC frames. The second, CRC_17, shall be used for FD frames with a data field up to 16 byte long. The third, CRC_21, shall be used for FD frames with a data field longer than 16 byte. The fourth, CRC_13, shall be used for the arbitration and control fields of XL frames while the fifth, CRC_32, shall be used for the whole XL frame. Each polynomial results in a Hamming distance of six. ; The receivers shall consider only the selected CRC polynomials to check for a CRC-error. ; The CRC_INIT_VECTOR shall be (0,...,0) for CRC_15. The CRC_INIT_VECTOR shall be (1,0,...,0) for CRC_17 and for CRC_21; where the single 1 is at the most significant bit position."
paraphrase = """1) CRC_15 for CC; CRC_17 for FD ≤16 B payload; CRC_21 for FD >16 B payload.
2) Init vector: all-zero for CRC_15; MSB-one for CRC_17 and CRC_21."""
side = "both"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = "Coverage closure criterion: three bins - (1) CB or CE frame (CRC_15), (2) FB or FE frame with DLC <= 8 (CRC_17), (3) FB or FE frame with DLC > 8 (CRC_21) - must each be hit."
label = "p_output_vc, p_reset_checker"
file = "src/can_mac_crc/hdl_tb/can_mac_crc_tb.vhd"
observability = "white_box"
verification_method = "simulation, coverage"
priority             = "P1"
status                = "in_progress"
group_title = "CRC rules"

[[requirement]]
id = "REQ-007"
source_clause = "§6.6.5.2, §6.6.5.3, §6.6.6.2, §6.6.6.3"
original_wording = "the active error flag shall consist of six consecutive dominant bits, and the passive error flag shall consist of six consecutive recessive bits unless it is overwritten by dominant bits from other nodes. ; The error delimiter shall consist of eight recessive bits. After sending an error flag, each node shall monitor the bus until it detects a recessive bit. At this point in time, every node shall finish sending its error flag and all nodes shall start sending seven more recessive bits simultaneously, to complete the 8-bit error delimiter. ; The overload flag shall consist of six dominant bits. ; The overload delimiter shall consist of eight recessive bits. After sending an overload flag, each node shall monitor the bus until it detects a recessive bit. At this point in time, every node shall finish sending its overload flag and all nodes shall start sending seven more recessive bits simultaneously, to complete the 8-bit overload delimiter."
paraphrase = """1) Active error flag: 6 consecutive dominant bits.
2) Passive error flag: 6 consecutive recessive bits (may be overwritten by dominant bits from other nodes).
3) Overload flag: 6 consecutive dominant bits.
4) Error and overload delimiters: 8 recessive bits each.
5) After the flag, all nodes monitor the bus and simultaneously begin their 7-bit delimiter on detecting the first recessive bit."""
side = "both"
layer = "system"
format_applicability = "CB, CE, FB, FE"
notes = "Code inspection targets the FSM delimiter counter start condition; waveform inspection targets the resulting bit sequence in GTKWave."
label = "p_fsm:~900, test_bus_off"
file = "src/can_mac/hdl_src/can_mac_fsm.vhd, can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "code_inspection, waveform_inspection"
priority             = "P1"
status                = "in_progress"
group_title = "Error and overload flags"

[[requirement]]
id = "REQ-008"
source_clause = "§6.6.7.1, §6.6.7.2, §6.6.7.3, §6.6.7.4"
original_wording = "DFs and RFs shall be separated from preceding frames, whatever frame type the preceding frames are (DF, RF, EF, OF), by a time period called inter-frame space. In contrast to this, EFs and OFs shall not be preceded by inter-frame space, and multiple OFs shall not be separated by inter-frame space. ; The intermission field shall consist of three recessive bits. During intermission, a node shall not start transmission of DFs or RFs. An OF may be transmitted. The detection of a dominant bit at the third bit of intermission shall be interpreted as SOF (see 6.6.8). ; A frame pending for transmission during the transmission of another frame shall be started in the first bit following intermission. ; The bus shall be recognized to be idle by receivers and by error active transmitters when the third bit of intermission is seen recessive; by error passive transmitters when the eighth bit of suspend transmission time is seen recessive; or when the bus integrating state is left (see 6.6.7.5). ; An error-passive node, which has been transmitter of the previous frame, shall suspend the start of further frame transmissions for 8 bit times following intermission. ; If another node starts a transmission during that suspend transmission time, the node shall become a receiver of this DF or RF frame."
paraphrase = """1) Intermission shall be exactly 3 recessive bits.
2) No DF or RF may be started during intermission.
3) A dominant third intermission bit shall be interpreted as SOF.
4) EFs and OFs shall not be preceded by inter-frame space; consecutive OFs shall not be separated by inter-frame space.
5) A pending frame shall be started at the first bit following intermission.
6) Bus idle is recognised at the third recessive intermission bit (error-active nodes/receivers), the eighth recessive suspend bit (error-passive transmitters), or on leaving bus-integration state.
7) An error-passive transmitter shall suspend for 8 bit times after intermission; if another node transmits during the suspend window, the node shall become a receiver."""
side = "both"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = ""
label = "p_fsm:~486, test_normal, test_bus_off"
file = "src/can_mac/hdl_src/can_mac_fsm.vhd, can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "code_inspection, waveform_inspection"
priority             = "P1"
status                = "in_progress"
group_title = "Inter-frame space"

[[requirement]]
id = "REQ-009"
source_clause = "§6.6.7.5"
original_wording = "CAN nodes shall start the bus re-integration after starting the protocol operation, during bus-off recovery, or (for nodes that are FD tolerant, FD enabled, or XL enabled) after detecting a protocol exception event. ; CAN nodes that are not in bus-off state shall finish the bus re-integration when the idle condition (see 3.34) is detected. ; There shall be a bit counter that is reset when the bus re-integration state is started or when the CAN bus is detected dominant at the sample point. The bit counter shall be incremented when the CAN bus is detected recessive at the sample point. The idle condition shall be detected when this bit counter reaches the value 11. ; For nodes that are FD tolerant, FD enabled, or XL enabled, there shall be a third reset condition for the bit counter. It shall be reset when detecting an edge that causes synchronization. When synchronization occurs, the counting of the sequence of 11 consecutive recessive bits shall be restarted."
paraphrase = """1) Nodes shall start bus re-integration on protocol startup or bus-off recovery.
2) Re-integration completes after 11 consecutive recessive bits at the sample point.
3) For FD-capable nodes, any synchronisation-causing edge shall reset the 11-bit recessive-bit counter."""
side = "both"
layer = "system"
format_applicability = "CB, CE, FB, FE"
notes = "Protocol exception event (third trigger in paragraph 6.6.7.5) is not implemented."
label = "p_fsm:~433, test_bus_off"
file = "src/can_mac/hdl_src/can_mac_fsm.vhd, can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "code_inspection, waveform_inspection"
priority             = "P1"
status                = "in_progress"
group_title = "Bus re-integration"

[[requirement]]
id = "REQ-010"
source_clause = "§6.6.7.3, §6.6.8"
original_wording = "SOF shall mark the beginning of DFs and RFs. It shall be dominant. ; A node shall send an SOF only when the bus is idle (see 6.6.7.3). ; If a node samples a dominant bit at the third bit of intermission, this node shall, if it has a pending transmission and if the node is error active or has been receiver of the previous frame, start transmitting its frame at the next bit with the first bit of its identifier and take part in arbitration, without first transmitting an SOF bit and without becoming receiver. ; The detection of a dominant bit on the bus during bus idle time shall be interpreted as SOF."
paraphrase = """1) SOF shall be a single dominant bit.
2) A node shall send SOF only when the bus is idle.
3) A dominant third intermission bit causes a node with a pending frame (if error-active or previous receiver) to skip SOF and begin arbitration immediately.
4) A dominant bit detected during bus idle shall be interpreted as SOF."""
side = "both"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = "Sub-claim 1 (SOF dominant) is the first sentence of §6.6.8; sub-claim 2 follows from the same clause. Sub-claim 3 is the skip-SOF arbitration shortcut. Sub-claim 4 (§6.6.7.3 last sentence) is the receiver-side SOF detection from idle; it is exercised by every test_normal run and confirmed by REQ-028 hard-sync at the SOF leading edge."
label = "p_fsm:~451, test_normal"
file = "src/can_mac/hdl_src/can_mac_fsm.vhd, can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "code_inspection, waveform_inspection"
priority             = "P1"
status                = "in_progress"
group_title = "Frame initiation"

