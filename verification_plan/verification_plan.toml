2) RFs have no data field; DLC indicates the requested data length."""
side = "both"
layer = "MAC"
format_applicability = "CB, CE"
notes = ""
label = ""
file = ""
observability = "black_box"
verification_method = "simulation"
priority             = "P2"
status                = "not_started"
group_title = "Remote frame"

[[requirement]]
id = "REQ-012"
source_clause = "§6.6.10.2, §6.6.11.2"
original_wording = "The SRR bit shall be transmitted recessive, but receivers shall accept recessive and dominant SRR bits. ; The RRS bit shall be transmitted dominant, but receivers shall accept recessive and dominant RRS bits."
paraphrase = """1) SRR (CE, FE): transmitted recessive; receivers accept either polarity without form error.
2) RRS (FB, FE): transmitted dominant; receivers accept either polarity without form error."""
side = "both"
layer = "MAC"
format_applicability = "CE, FB, FE"
notes = "SRR applies to CE and FE only; RRS applies to FB and FE only. The RX sub-claim is implicit: no form error is generated because the FSM has no polarity check at those bit positions."
label = "p_fsm:~546, p_fsm:~548, test_normal"
file = "src/can_mac/hdl_src/can_mac_fsm.vhd, can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "code_inspection, waveform_inspection"
priority             = "P2"
status                = "in_progress"
group_title = "SRR and RRS reserved bits"

[[requirement]]
id = "REQ-013"
source_clause = "§6.6.10.5, §6.6.11.5"
original_wording = "In CC frames, stuff bits shall not be included in the relevant bit stream for CRC calculation. ; The relevant bit stream for the CRC calculation shall be the bit stream consisting of SOF, arbitration field, control field, and (if present) data field. The stuff count and the dynamic stuff bits, but not the fixed stuff bits, shall be included in the relevant bit stream for CRC calculation of FD frames."
paraphrase = """1) CC: SOF, arbitration, control, and data fields (dynamic stuff bits excluded).
2) FD: SOF, arbitration, control, data, dynamic stuff bits, and SBC field (fixed stuff bits excluded)."""
side = "both"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = ""
label = "p_fsm:~299, p_fsm:~216"
file = "src/can_mac/hdl_src/can_mac_fsm.vhd"
observability = "white_box"
verification_method = "code_inspection"
priority             = "P1"
status                = "in_progress"
group_title = "CRC bit stream coverage"

[[requirement]]
id = "REQ-014"
source_clause = "§6.6.10.6, §6.6.11.6, §6.6.14"
original_wording = "All receivers check the consistency of the received DF or RF and shall acknowledge a consistent frame and shall flag an inconsistent frame by means of an EF (see 6.6.2). A DF or RF that is not acknowledged shall be regarded as corrupted and shall be flagged by the transmitting node with an EF. All nodes that receive the matching FCRC sequence shall send an ACK within the ACK slot by overwriting the recessive bit of the transmitter with a dominant bit (they send ACK). ; All receivers check the consistency of the received DF and shall acknowledge a consistent frame and shall flag an inconsistent frame by means of an EF (see 6.6.2). A DF that is not acknowledged shall be regarded as corrupted and shall be flagged by the transmitting node with an EF. Nodes that receive the matching FCRC sequence and the matching stuff count shall send an ACK within the ACK slot by overwriting the recessive bit of the transmitter with a dominant bit (they send ACK). In FD frames, all nodes shall accept an up to two bit long dominant phase of overlapping ACK slot bits as a valid ACK, to compensate for phase shifts between the receivers. ; The ACK delimiter, being the last bit of the ACK field, shall be a recessive bit. Consequently, the ACK slot is surrounded by recessive bits (CRC delimiter, ACK delimiter). ; All receivers shall check the consistency of all received DFs and RFs and they shall acknowledge all consistent DFs and RFs. Acknowledgement shall not depend on the frame's identifier."
paraphrase = """1) Receivers shall ACK consistent frames and flag inconsistent frames with an EF.
2) Transmitters shall flag unacknowledged frames with an EF.
3) FD frames tolerate up to a 2-bit dominant ACK overlap to compensate for receiver phase differences.
4) The ACK delimiter shall be one recessive bit; the ACK slot is surrounded by recessive bits on both sides.
5) ACK shall not depend on the frame identifier."""
side = "both"
layer = "system"
format_applicability = "CB, CE, FB, FE"
notes = ""
label = "test_normal"
file = "can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "simulation, waveform_inspection"
priority             = "P1"
status                = "in_progress"
group_title = "Frame acknowledgement"


[[requirement]]
id = "REQ-015"
source_clause = "§6.6.10.3, §6.6.11.2, §6.6.11.3"
original_wording = "The first two bits of the control field shall be transmitted dominant, followed by the DLC. ; The first bit of the control field is the IDE bit in CBFF, and it is r1 in CEFF, matching with the FDF bit in FEFF and a CAN FD tolerant CAN node shall detect a protocol exception event when this bit is received recessive. ; The second bit of the control field is r0 bit. In CBFF, this bit matches with the FDF bit in FBFF and a CAN FD tolerant CAN node shall detect a protocol exception event when this bit is received recessive. In CEFF, receivers shall accept it with recessive and with dominant state. ; This bit distinguishes between CC frames and FD or XL frames. It is recessive in FD and XL frames, and it is dominant in CC frames. ; The only difference is the IDE bit, which distinguishes between the identifier formats and is part of the control field in FBFF and part of the arbitration field in FEFF. ; In FD frames, the FDF bit shall be followed by the dominant res bit. ; When an FD enabled receiver detects the res bit to be recessive instead of the expected dominant it shall, when protocol exception handling is enabled, detect a protocol exception event; when protocol exception handling is disabled, it shall treat this as a form error."
paraphrase = """1) FDF: dominant in CC frames, recessive in FD frames.
2) The first two CC control field bits (IDE in CBFF, r1/r0 in CEFF) shall be transmitted dominant.
3) An FD-tolerant receiver that samples a recessive r0 (CBFF) or r1 (CEFF) shall detect a protocol exception event.
4) In FBFF the IDE bit is the first control field bit; in FEFF it is in the arbitration field after SRR.
5) The res bit (FB, FE) shall be dominant; a recessive res bit is a form error."""
side = "both"
layer = "MAC"
format_applicability = "CB, CE, FB, FE"
notes = "Protocol exception handling is not implemented; a recessive r0/r1 (sub-claim 3) or res bit (sub-claim 5) always produces a form error. Sub-claim 3 is therefore not exercised in the implementation. Sub-claim 4 is structural: the MAC FSM must place the IDE bit at different field positions for FBFF vs FEFF. Sub-claims 1, 4, and 5 have existing labels; sub-claims 2 and 3 require separate inspection."
label = "p_fsm:~613, test_normal"
file = "src/can_mac/hdl_src/can_mac_fsm.vhd, can_bus_controller_fd/can_mac_pcs_fce/hdl_tb/can_mac_pcs_fce_tb.vhd"
observability = "white_box"
verification_method = "code_inspection, waveform_inspection"
priority             = "P1"
status                = "in_progress"
group_title = "FDF bit and CC/FD format differentiation"

